<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Протокол инструментального обследования лесного участка | Лесовик ПРО</title>
    <style>
        :root {
            --bg-paper: #F9FBF9;
            --text-graphite: #333333;
            --forest-green: #2D5A27;
            --forest-light: #8FBC8F;
            --border-color: #E0E0E0;
            --card-bg: #FFFFFF;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-paper);
            color: var(--text-graphite);
            margin: 0; padding: 20px;
            line-height: 1.5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 15px rgba(45,90,39,0.05);
        }
        h2 {
            font-family: 'Merriweather', serif;
            color: var(--forest-green);
            margin-top: 0;
            border-bottom: 2px solid var(--forest-green);
            padding-bottom: 8px;
            font-size: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--forest-green);
            margin-bottom: 5px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            background: var(--bg-paper);
            color: var(--text-graphite);
        }
        textarea { resize: vertical; height: 80px; }
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        @media(max-width: 600px) { .row { grid-template-columns: 1fr; } }
        .btn {
            background-color: var(--forest-green);
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-size: 13px;
        }
        .btn:hover { opacity: 0.9; }
        .result-box {
            margin-top: 25px;
            padding: 15px;
            background: rgba(45,90,39,0.04);
            border: 1px dashed var(--forest-green);
            border-radius: 8px;
            display: none;
        }
        .result-box h3 {
            margin-top: 0;
            color: var(--forest-green);
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📋 Протокол инструментального обследования</h2>
    <p style="font-size: 13px; opacity: 0.8;">Автоматизированный полевой модуль для фиксации параметров насаждений, координат и дефектов участков.</p>

    <form id="instrumentalForm" onsubmit="generateProtocol(event)">
        <div class="row">
            <div class="form-group">
                <label>Субъект РФ / Лесничество</label>
                <input type="text" id="region" placeholder="Республика Коми, Сыктывкарское" required>
            </div>
            <div class="form-group">
                <label>Участковое лесничество</label>
                <input type="text" id="forestry" placeholder="Пригородное" required>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Номер квартала / выдела</label>
                <input type="text" id="kv_vyd" placeholder="Кв. 42, Выдел 12" required>
            </div>
            <div class="form-group">
                <label>Цель обследования</label>
                <select id="goal">
                    <option value="ЛПО (Санитарное состояние)">Лесопатологическое обследование (ЛПО)</option>
                    <option value="Отвод и таксация делянки">Отвод и таксация лесосеки</option>
                    <option value="Проверка после лесонарушения">Фиксация нарушений / ущерба</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Фактическая площадь (га)</label>
                <input type="number" id="area" step="0.01" placeholder="2.5" required>
            </div>
            <div class="form-group">
                <label>Преобладающая порода</label>
                <input type="text" id="species" placeholder="Сосна / Ель" required>
            </div>
        </div>

        <div class="form-group">
            <label>Инструментальные данные и замеры (приборы, азимуты, средняя высота/диаметр)</label>
            <textarea id="measurements" placeholder="Например: Замер выполнен буссолью и высотомером. Средняя высота — 22 м, диаметр — 28 см. Запас на выделе — 180 м³. Признаки повреждения: корневая губка, ветровал до 15%." required></textarea>
        </div>

        <div class="form-group">
            <label>Особые отметки / Выводы комиссии</label>
            <textarea id="conclusions" placeholder="Участок требует проведения выборочной санитарной рубки..."></textarea>
        </div>

        <button type="submit" class="btn">🖨️ Сформировать протокол (Акт)</button>
    </form>

    <div id="resultBox" class="result-box">
        <h3>📄 Готовый проект протокола:</h3>
        <div id="protocolOutput" style="font-family: monospace; font-size: 12px; white-space: pre-wrap; line-height: 1.4;"></div>
        <button class="btn" style="background-color: #0284C7; margin-top: 15px;" onclick="window.print()">🖨️ Распечатать / Сохранить в PDF</button>
    </div>
</div>

<script>
function generateProtocol(e) {
    e.preventDefault();
    
    const region = document.getElementById('region').value;
    const forestry = document.getElementById('forestry').value;
    const kv_vyd = document.getElementById('kv_vyd').value;
    const goal = document.getElementById('goal').value;
    const area = document.getElementById('area').value;
    const species = document.getElementById('species').value;
    const measurements = document.getElementById('measurements').value;
    const conclusions = document.getElementById('conclusions').value;
    
    const currentDate = new Date().toLocaleDateString('ru-RU');

    const text = `УТВЕРЖДАЮ / СОГЛАСОВАНО
ПРОТОКОЛ ИНСТРУМЕНТАЛЬНОГО ОБСЛЕДОВАНИЯ № [ЛЕСОВИК-PRO]
Дата составления: ${currentDate}

1. ОБЩИЕ СВЕДЕНИЯ:
- Субъект РФ / Лесничество: ${region}
- Участковое лесничество: ${forestry}
- Местоположение: ${kv_vyd}
- Цель обследования: ${goal}
- Заявленная/фактическая площадь: ${area} га
- Преобладающая древесная порода: ${species}

2. ТЕХНИЧЕСКАЯ И ИНСТРУМЕНТАЛЬНАЯ ЧАСТЬ:
${measurements}

3. ВЫВОДЫ И ЗАКЛЮЧЕНИЕ КОМИССИИ:
${conclusions}

Документ сформирован автоматически с помощью цифрового комплекса «Лесовик ПРО» (https://lesovik-pro.ru/).
`;

    document.getElementById('protocolOutput').innerText = text;
    document.getElementById('resultBox').style.display = 'block';
    document.getElementById('resultBox').scrollIntoView({ behavior: 'smooth' });
}
</script>

</body>
</html>
