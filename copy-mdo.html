		#cap tr { display: flex; flex-wrap: wrap; margin: 3px 0; column-gap: 8px; align-items: center; }

		select { border: 1px solid #ccd5cc; background: #eef2ee; border-radius: 4px; padding: 3px 5px; font-size: 13px; }
		td, th { border: 1px solid #b5c4b5; padding: 4px 2px; text-align: center; }

		.num, .upd > input { text-align: right; }
		.upd { background: #f9fbf9; }
		.even > td { background: #f0f4f0; }
		.upd > input { width: 32px; border: 0; background: transparent; padding: 2px 0; font-weight: bold; text-align: center; font-size: 12px; }
		input:focus { outline: 2px solid #2D5A27; background: #fff; }
		.but1, .but, .abr_map { 
			margin: 5px 4px 0 0; outline: none; padding: 6px 14px; border-radius: 999px; 
			cursor: pointer; display: inline-flex; align-items: center; gap: 5px; font-weight: bold; font-size: 13px; text-decoration: none; 
		}
		.abr_but { padding: 2px 8px; border-radius: 999px; cursor: pointer; border: 1px solid #6839f7; background: #fff; }
		.abr_map { border: 2px solid #2D5A27; background: #fff; color: #2D5A27; }
		#but { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 10px 0; }
		.but { border: 2px solid #E67E22; background: #F39C12; color: #fff; }
		.but1 { border: 2px solid #2D5A27; background: #2D5A27; color: #fff; }
		.lcol, .trow1, .trow2 th, .trow3 td { position: sticky; background: #e4ece4; }
		.lcol { left: 0; font-weight: bold; z-index: 5; }
		.trow1 { background: #d0ded0; z-index: 10; top: 0; font-weight: bold; padding: 6px; }
		.trow2 th { top: 25px; z-index: 8; background: #dce7dc; font-size: 11px; }
		.trow3 td { top: 48px; z-index: 7; background: #eaf0ea; font-size: 10px; font-weight: bold; }
		#inc { display: flex; justify-content: center; gap: 2px; }
		#inc label { display: inline-block; cursor: pointer; padding: 2px 6px; line-height: 18px; user-select: none; border-radius: 4px; font-size: 11px; }
		input[type=radio]:checked + label { background: #2D5A27; color: #fff; }
		#inc > input[type=radio] { display: none; }
		.gr_kvartal { background: #fff; border: 1px solid #ccd5cc; border-radius: 8px; margin-bottom: 12px; padding: 8px; }
		.gr_kvartal summary { cursor: pointer; font-size: 14px; font-weight: bold; color: #2D5A27; padding: 4px; }
		.abris_svg { width: 100%; max-width: 600px; height: 420px; background: #ffffff; border: 1px solid #ccd5cc; border-radius: 6px; margin-top: 8px; }
		.abi { border: 1px solid #ccd5cc; background: #fff; width: 55px; border-radius: 4px; padding: 3px; font-size: 12px; }
		.abicr { width: 95px; border: 1px solid #ccd5cc; background: #fff; border-radius: 4px; padding: 3px; font-size: 12px; }
		@media print { 
			#but, .noP, button { display: none !important; } 
			body { background: #fff; }
		}
	</style>
</head>
<body>
	<h2>Лесовик ПРО • Отвод и таксация лесосек (Республика Коми)</h2>

			Печать

		<a class="abr_map" href="https://resurs-stretch.ru/" target="_blank" title="Экосистема РЕСУРС">

<script>
	// 36 ЛЕСНИЧЕСТВ РЕСПУБЛИКИ КОМИ

	// СЕТКИ ОБЪЕМОВ СТВОЛОВ (СЕВЕРО-ВОСТОК, РЕСПУБЛИКА КОМИ)

			3: { 8: 0.026, 12: 0.073, 16: 0.149, 20: 0.260, 24: 0.407, 28: 0.592, 32: 0.818, 36: 1.085, 40: 1.395 },

			1: { 8: 0.034, 12: 0.096, 16: 0.198, 20: 0.345, 24: 0.540, 28: 0.785, 32: 1.080, 36: 1.425, 40: 1.820 },

	const steps = [8, 12, 16, 20, 24, 28, 32, 36, 40];
	let currentStep = 1; // Режим шага точковки: -1, "Д", +1
	let store = JSON.parse(localStorage.getItem('lesovik_mdo_clone') || '{}');

	if (!store.forest) {
		store = {

			subforest: "Важгортское",
			tract: "",
			kvartal: "282",
			vydel: "15",
			lpvydel: "1",
			area: "1.0",
			purpose: "Эксплуатационные леса",
			species: ["С", "Е", "Б", "Ос"],

	function initApp() {
		renderCap();
		renderBody();
		renderAbris();
	}

	function renderCap() {
		const cap = document.getElementById('cap');
		let forestOptions = forestData.map(f => `<option value="${f[0]}" ${store.forest === f[0] ? 'selected' : ''}>${f[0]} лесничество</option>`).join('');
		
		const currentForestObj = forestData.find(f => f[0] === store.forest) || forestData[0];
		let subOptions = currentForestObj[1].map(s => `<option value="${s}" ${store.subforest === s ? 'selected' : ''}>${s} уч. лесничество</option>`).join('');

		cap.innerHTML = `
			<table id="capt">
				<tbody>
					<tr>
						<td><label>Лесничество:</label></td>
						<td><select id="sel_forest" onchange="onForestChange()">${forestOptions}</select></td>
						<td><label>Участковое:</label></td>
						<td><select id="sel_subforest" onchange="saveCap()">${subOptions}</select></td>
					</tr>
					<tr>
						<td><label>Урочище:</label></td>
						<td><input id="inp_tract" value="${store.tract || ''}" oninput="saveCap()" placeholder="дачи/колхозы"></td>
						<td><label>Орган власти:</label></td>
						<td><input value="Минприроды Республики Коми" readonly style="opacity:0.8;"></td>
					</tr>
					<tr>
						<td><label>Квартал / Выдел:</label></td>
						<td>

							выд. <input id="inp_vyd" value="${store.vydel || ''}" style="width:45px;" oninput="saveCap()">
							ЛП <input id="inp_lp" value="${store.lpvydel || ''}" style="width:45px;" oninput="saveCap()">
						</td>
						<td><label>Экспл. площадь (га):</label></td>
						<td><input id="inp_area" inputmode="numeric" value="${store.area || '1.0'}" style="width:60px;" oninput="saveCap()"></td>
					</tr>
				</tbody>
			</table>
		`;
	}

	function onForestChange() {
		store.forest = document.getElementById('sel_forest').value;
		const currentForestObj = forestData.find(f => f[0] === store.forest) || forestData[0];
		store.subforest = currentForestObj[1][0];
		saveCap();
		renderCap();
	}

	function saveCap() {
		store.forest = document.getElementById('sel_forest').value;
		store.subforest = document.getElementById('sel_subforest').value;
		store.tract = document.getElementById('inp_tract').value;
		store.kvartal = document.getElementById('inp_kv').value;
		store.vydel = document.getElementById('inp_vyd').value;
		store.lpvydel = document.getElementById('inp_lp').value;
		store.area = document.getElementById('inp_area').value;
		saveStorage();
		recalcAll();
	}

		const bod = document.getElementById('bod');
		let html = `

				<summary>
					<b>Деляночный перечет: кв. ${store.kvartal || '-'}, выд. ${store.vydel || '-'}</b>

						<span id="inc">
							<input type="radio" name="inc_radio" id="inc1" ${currentStep === -1 ? 'checked' : ''}><label for="inc1" onclick="setStep(-1)">-1</label>
							<input type="radio" name="inc_radio" id="inc2" ${currentStep === 0 ? 'checked' : ''}><label for="inc2" onclick="setStep(0)">Д</label>
							<input type="radio" name="inc_radio" id="inc3" ${currentStep === 1 ? 'checked' : ''}><label for="inc3" onclick="setStep(1)">+1</label>
						</span>
					</span>
				</summary>
				
				<div style="overflow-x:auto;">

						<thead>
							<tr class="trow1">
								<th rowspan="2" class="lcol">Порода</th>
								<th rowspan="2">Разряд</th>
								<th colspan="9">Ступени толщины (диаметры, см)</th>
								<th rowspan="2">Всего стволов</th>
								<th rowspan="2">Запас, м³</th>
							</tr>
							<tr class="trow2">
								${steps.map(s => `<th>${s}</th>`).join('')}
							</tr>
						</thead>
						<tbody>
		`;

		store.species.forEach(sp => {
			const rz = store.razryad[sp] || 3;
			html += `
				<tr>
					<td class="lcol">${sp}</td>
					<td>
						<select onchange="changeRazryad('${sp}', this.value)">
							${[1, 2, 3, 4, 5].map(r => `<option value="${r}" ${rz == r ? 'selected' : ''}>${r}</option>`).join('')}
						</select>
					</td>
					${steps.map(d => {
						const key = `${sp}_${d}`;
						const val = store.tally[key] || 0;
						return `<td class="upd"><input id="cell_${key}" value="${val}" readonly onclick="handleCellClick('${sp}',${d})"></td>`;
					}).join('')}
					<td id="tot_st_${sp}" style="font-weight:bold;">0</td>
					<td id="tot_vol_${sp}" style="font-weight:bold; color:#2D5A27;">0.00</td>
				</tr>
			`;
		});

		html += `
						</tbody>
						<tfoot>
							<tr style="background:#e0ebe0; font-weight:bold;">
								<td colspan="2" class="lcol">ИТОГО:</td>
								${steps.map(d => `<td id="col_tot_${d}">0</td>`).join('')}
								<td id="grand_stems">0</td>
								<td id="grand_volume" style="color:#2D5A27; font-size:110%;">0.00</td>
							</tr>
						</tfoot>
					</table>
				</div>

				<div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-top:8px;">
					<div><b>Формула состава:</b> <span id="formula_display" style="font-size:115%; color:#2D5A27; font-weight:bold;">—</span></div>
					<div><b>Запас на 1 га:</b> <span id="vol_per_ha" style="font-weight:bold;">0.0 м³/га</span></div>
				</div>
			</div>

			<details class="gr_kvartal" open>
				<summary><b>Интерактивный абрис делянки</b></summary>
				<div id="abris"></div>
			</details>
		`;

		bod.innerHTML = html;
		recalcAll();
	}

	function setStep(val) {
		currentStep = val;
		document.getElementById('inc1').checked = (val === -1);
		document.getElementById('inc2').checked = (val === 0);
		document.getElementById('inc3').checked = (val === 1);
	}

	function handleCellClick(sp, d) {
		const key = `${sp}_${d}`;
		let val = parseInt(store.tally[key] || 0);

		if (currentStep === 0) {
			// Режим ручного ввода
			let n = prompt(`Стволов для ${sp} (Ø ${d} см):`, val);
			if (n !== null) {
				store.tally[key] = Math.max(0, parseInt(n) || 0);
			}
		} else {
			// Шаг +1 или -1
			val += currentStep;
			store.tally[key] = Math.max(0, val);
		}

		document.getElementById(`cell_${key}`).value = store.tally[key];
		saveStorage();
		recalcAll();
	}

	function changeRazryad(sp, val) {
		store.razryad[sp] = parseInt(val);
		saveStorage();
		recalcAll();
	}

	function recalcAll() {
		const area = parseFloat(store.area) || 1.0;
		let totalVolAll = 0;
		let totalStemsAll = 0;
		let speciesVolMap = {};
		let colTotals = {};
		steps.forEach(d => colTotals[d] = 0);

		store.species.forEach(sp => {
			const rz = store.razryad[sp] || 3;
			const vGrid = (VOLUMES[sp] && VOLUMES[sp][rz]) ? VOLUMES[sp][rz] : (VOLUMES['С'][3]);

			let spStems = 0;
			let spVol = 0;

			steps.forEach(d => {
				const count = parseInt(store.tally[`${sp}_${d}`] || 0);
				spStems += count;
				colTotals[d] += count;

				const unitV = vGrid[d] || 0;
				spVol += count * unitV;
			});

			speciesVolMap[sp] = spVol;
			totalVolAll += spVol;
			totalStemsAll += spStems;

			const elSt = document.getElementById(`tot_st_${sp}`);
			const elVol = document.getElementById(`tot_vol_${sp}`);
			if (elSt) elSt.innerText = spStems;
			if (elVol) elVol.innerText = spVol.toFixed(2);
		});

		steps.forEach(d => {
			const el = document.getElementById(`col_tot_${d}`);
			if (el) el.innerText = colTotals[d];
		});

		const grandSt = document.getElementById('grand_stems');
		const grandVol = document.getElementById('grand_volume');
		if (grandSt) grandSt.innerText = totalStemsAll;
		if (grandVol) grandVol.innerText = totalVolAll.toFixed(2);

		// Формирование формулы состава
		let formula = "—";
		if (totalVolAll > 0) {
			let parts = [];
			for (let sp in speciesVolMap) {
				const share = Math.round((speciesVolMap[sp] / totalVolAll) * 10);
				if (share > 0) parts.push(`${share}${sp}`);
			}
			formula = parts.join('') || '10' + Object.keys(speciesVolMap)[0];
		}

		const fEl = document.getElementById('formula_display');
		const vHaEl = document.getElementById('vol_per_ha');
		if (fEl) fEl.innerText = formula;
		if (vHaEl) vHaEl.innerText = (totalVolAll / area).toFixed(1) + " м³/га";
	}

	// ЧЕРТЕЖ АБРИСА
	function renderAbris() {
		const container = document.getElementById('abris');
		if (!container) return;

		let html = `
			<div style="display:flex; gap:12px; flex-wrap:wrap;">
				<div style="flex:1; min-width:320px;">
					<svg class="abris_svg" id="abris_svg" viewBox="0 0 600 420">
						<defs>
							<marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
								<path d="M 0 0 L 10 5 L 0 10 z" fill="#c00"/>
							</marker>
						</defs>
						<!-- Стрелка С-Ю -->
						<line x1="30" y1="100" x2="30" y2="35" stroke="#c00" stroke-width="2.5" marker-end="url(#arrow)"/>
						<text x="24" y="28" fill="#c00" font-size="12" font-weight="bold">С</text>
						<text x="24" y="116" fill="#222" font-size="12" font-weight="bold">Ю</text>

						<polyline id="poly_tie" fill="none" stroke="#E67E22" stroke-width="2" stroke-dasharray="4,4" />
						<polygon id="poly_plot" fill="rgba(45, 90, 39, 0.2)" stroke="#2D5A27" stroke-width="2.5" />
						<g id="svg_points"></g>
					</svg>
					<div id="abris_stats" style="font-weight:bold; margin-top:5px; font-size:12px;"></div>
				</div>

				<div style="flex:1; min-width:300px;">
					<table style="width:100%;">
						<thead>
							<tr style="background:#eaf0ea;">
								<th>Тип</th>
								<th>Румб</th>
								<th>Угол, °</th>
								<th>Длина, м</th>
								<th>✕</th>
							</tr>
						</thead>
						<tbody id="abris_tbody"></tbody>
					</table>
					<div style="margin-top:6px;">
						<button class="abr_but" onclick="addAbrisLine('p')">+ Привязка</button>
						<button class="abr_but" onclick="addAbrisLine('d')">+ Сторона</button>
					</div>
				</div>
			</div>
		`;
		container.innerHTML = html;
		drawAbrisVector();
	}

	function drawAbrisVector() {
		const tbody = document.getElementById('abris_tbody');
		if (!tbody) return;

		tbody.innerHTML = store.abris.map((l, i) => `
			<tr>
				<td>${l.type === 'p' ? 'Привязка' : 'Делянка'}</td>
				<td>
					<select onchange="store.abris[${i}].rumb=this.value; drawAbrisVector(); saveStorage();">
						${["СВ", "ЮВ", "ЮЗ", "СЗ"].map(r => `<option value="${r}" ${l.rumb === r ? 'selected' : ''}>${r}</option>`).join('')}
					</select>
				</td>
				<td><input type="number" class="abi" value="${l.angle}" oninput="store.abris[${i}].angle=parseFloat(this.value)||0; drawAbrisVector(); saveStorage();"></td>
				<td><input type="number" class="abi" value="${l.dist}" oninput="store.abris[${i}].dist=parseFloat(this.value)||0; drawAbrisVector(); saveStorage();"></td>
				<td><button onclick="store.abris.splice(${i},1); drawAbrisVector(); saveStorage();" style="color:red; border:0; background:none; cursor:pointer;">✕</button></td>
			</tr>
		`).join('');

		// Геометрический расчет координат
		let x = 0, y = 0;
		let tiePts = [[0, 0]];
		let plotPts = [];
		let totalPerim = 0;
		let sumDx = 0, sumDy = 0;

		store.abris.forEach(l => {
			let azim = l.angle;
			if (l.rumb === 'ЮВ') azim = 180 - l.angle;
			if (l.rumb === 'ЮЗ') azim = 180 + l.angle;
			if (l.rumb === 'СЗ') azim = 360 - l.angle;

			const rad = azim * Math.PI / 180;
			const dx = l.dist * Math.sin(rad);
			const dy = -l.dist * Math.cos(rad);

			x += dx;
			y += dy;

			if (l.type === 'p') {
				tiePts.push([x, y]);
			} else {
				if (plotPts.length === 0) {
					plotPts.push(tiePts[tiePts.length - 1]);
				}
				plotPts.push([x, y]);
				totalPerim += l.dist;
				sumDx += dx;
				sumDy += dy;
			}
		});

		const nev = Math.sqrt(sumDx * sumDx + sumDy * sumDy);

		// Площадь по формуле Гаусса
		let areaSqM = 0;
		if (plotPts.length > 2) {
			for (let i = 0; i < plotPts.length; i++) {
				let j = (i + 1) % plotPts.length;
				areaSqM += plotPts[i][0] * plotPts[j][1] - plotPts[j][0] * plotPts[i][1];
			}
			areaSqM = Math.abs(areaSqM) / 2;
		}

		document.getElementById('abris_stats').innerText = `Периметр: ${totalPerim} м | Невязка: ${nev.toFixed(1)} м | Площадь: ${(areaSqM / 10000).toFixed(2)} га`;

		// Масштабирование под холст 600x420
		const allPts = tiePts.concat(plotPts);
		let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
		allPts.forEach(p => {
			if (p[0] < minX) minX = p[0];
			if (p[0] > maxX) maxX = p[0];
			if (p[1] < minY) minY = p[1];
			if (p[1] > maxY) maxY = p[1];
		});

		const spanX = (maxX - minX) || 100;
		const spanY = (maxY - minY) || 100;
		const scale = Math.min(460 / spanX, 320 / spanY);
		const offsetX = 70;
		const offsetY = 50;

		const mapX = val => (val - minX) * scale + offsetX;
		const mapY = val => (val - minY) * scale + offsetY;

		const tiePoly = document.getElementById('poly_tie');
		const plotPoly = document.getElementById('poly_plot');
		const ptsGroup = document.getElementById('svg_points');

		if (tiePoly) tiePoly.setAttribute('points', tiePts.map(p => `${mapX(p[0])},${mapY(p[1])}`).join(' '));
		if (plotPoly) plotPoly.setAttribute('points', plotPts.map(p => `${mapX(p[0])},${mapY(p[1])}`).join(' '));

		if (ptsGroup) {
			ptsGroup.innerHTML = allPts.map((p, idx) => `
				<circle cx="${mapX(p[0])}" cy="${mapY(p[1])}" r="4" fill="${idx === 0 ? '#c00' : '#2D5A27'}" />
				<text x="${mapX(p[0]) + 6}" y="${mapY(p[1]) - 4}" font-size="10" font-weight="bold">${idx}</text>
			`).join('');
		}
	}

	function addAbrisLine(type) {
		store.abris.push({ rumb: "СВ", angle: 45, dist: 100, type: type });
		saveStorage();
		drawAbrisVector();
	}

	function saveStorage() {
		localStorage.setItem('lesovik_mdo_clone', JSON.stringify(store));
	}

	function exportData() {
		const jsonStr = JSON.stringify(store, null, 2);
		const blob = new Blob([jsonStr], { type: 'application/json' });
		const a = document.createElement('a');
		a.href = URL.createObjectURL(blob);
		a.download = `mdo_${store.forest}_кв${store.kvartal}.json`;
		a.click();
	}

	function clearData() {
		if (confirm("Точно очистить все данные перечета?")) {
			store.tally = {};
			saveStorage();
			renderBody();
		}
	}

	function printReport() {
		window.print();
	}

	document.addEventListener('DOMContentLoaded', initApp);
</script>
