<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#080c0a">
  <title>Комплексный Детектор БПЛА</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #070908;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      padding: 10px;
      padding-top: max(10px, env(safe-area-inset-top));
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
    }

    /* Верхний статус-бар датчиков */
    .sensor-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      margin-bottom: 8px;
    }
    .sensor-badge {
      background: #101713;
      border: 1px solid #1a2c22;
      border-radius: 6px;
      padding: 6px 2px;
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      color: #6a8577;
    }
    .sensor-badge.active {
      border-color: #00ff66;
      color: #00ff66;
      background: #0f2418;
      box-shadow: 0 0 6px rgba(0,255,102,0.2);
    }

    /* Главный щит оповещения */
    .threat-display {
      background: #0d1410;
      border: 2px solid #00ff66;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      margin-bottom: 8px;
      transition: all 0.2s ease;
    }
    .threat-display.danger {
      background: #2b0604;
      border-color: #ff2200;
      animation: alert-pulse 0.7s infinite alternate;
    }
    @keyframes alert-pulse {
      from { box-shadow: 0 0 6px #ff2200; }
      to { box-shadow: 0 0 22px #ff2200; }
    }
    .threat-title {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #00ff66;
    }
    .threat-display.danger .threat-title {
      color: #ff3311;
    }
    .threat-source {
      font-size: 12px;
      color: #8fa89b;
      margin-top: 2px;
    }

    /* Шкала мощности сигнала */
    .meter-container {
      margin-top: 8px;
      text-align: left;
    }
    .meter-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 600;
      color: #8fa89b;
      margin-bottom: 2px;
    }
    .meter-track {
      width: 100%;
      height: 12px;
      background: #141f18;
      border-radius: 3px;
      overflow: hidden;
      border: 1px solid #1f3327;
    }
    .meter-fill {
      height: 100%;
      width: 0%;
      background: #00ff66;
      transition: width 0.08s ease-out;
    }
    .threat-display.danger .meter-fill {
      background: #ff2200;
    }

    /* Визуальный блок (Видео / Спектр) */
    .view-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 8px;
      min-height: 140px;
    }
    .view-card {
      flex: 1;
      background: #040605;
      border: 1px solid #1a2c22;
      border-radius: 6px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas, video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .view-tag {
      position: absolute;
      top: 4px;
      left: 6px;
      font-size: 9px;
      background: rgba(0,0,0,0.7);
      padding: 2px 4px;
      border-radius: 3px;
      color: #00ff66;
      font-weight: bold;
    }

    /* Сетка управления */
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-bottom: 6px;
    }
    button {
      background: #111a14;
      color: #00ff66;
      border: 1px solid #1f382a;
      border-radius: 6px;
      padding: 12px 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    button:active {
      background: #00ff66;
      color: #000;
    }
    button.active-btn {
      background: #004d1f;
      border-color: #00ff66;
      color: #fff;
    }
    button.test-btn {
      color: #ffaa00;
      border-color: #553a00;
    }
    button.reset-btn {
      color: #ff6666;
      border-color: #4a1818;
    }

    /* Настройки порога и IP */
    .tool-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0e1511;
      border: 1px solid #1a2c22;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 11px;
      margin-bottom: 6px;
    }
    .tool-bar input[type=range] {
      flex: 1;
      margin: 0 8px;
      accent-color: #00ff66;
    }

    /* Консоль журнала */
    .log-bar {
      font-size: 10px;
      color: #5d7869;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      height: 14px;
    }
  </style>
</head>
<body>

  <!-- Статус подключенных систем -->
  <div class="sensor-bar">
    <div id="badge-mic" class="sensor-badge">ЗВУК (FFT)</div>
    <div id="badge-cam" class="sensor-badge">ОПТИКА (CV)</div>
    <div id="badge-rf" class="sensor-badge">РАДИО (ESP)</div>
    <div id="badge-sdr" class="sensor-badge">USB SDR</div>
  </div>

  <!-- Экран угрозы -->
  <div id="threat-panel" class="threat-display">
    <div id="threat-status" class="threat-title">НАБЛЮДЕНИЕ</div>
    <div id="threat-source" class="threat-source">Все контуры сканирования активны</div>
    
    <div class="meter-container">
      <div class="meter-meta">
        <span>ИНТЕНСИВНОСТЬ СИГНАЛА</span>
        <span id="meter-val">0%</span>
      </div>
      <div class="meter-track">
        <div id="meter-fill" class="meter-fill"></div>
      </div>
    </div>
  </div>

  <!-- Визуализаторы: Камера и Звуковой спектр -->
  <div class="view-container">
    <div class="view-card" id="cam-box" style="display: none;">
      <span class="view-tag">ОПТИЧЕСКИЙ ТРЕКИНГ НЕБА</span>
      <video id="video-stream" autoplay playsinline muted style="display:none;"></video>
      <canvas id="cam-canvas"></canvas>
    </div>
    <div class="view-card">
      <span class="view-tag">АКУСТИЧЕСКИЙ СПЕКТР</span>
      <canvas id="audio-canvas"></canvas>
    </div>
  </div>

  <!-- Ползунок порога -->
  <div class="tool-bar">
    <span>Порог:</span>
    <input type="range" id="threshold" min="30" max="95" value="65">
    <span id="threshold-text" style="font-weight: bold; width: 26px;">65%</span>
    <button id="btn-sound" style="padding: 4px 8px; font-size: 10px; margin-left: 8px;">СИРЕНА: ВЫКЛ</button>
  </div>

  <!-- Панель включения контуров -->
  <div class="controls-grid">
    <button id="btn-toggle-mic">1. АКУСТИКА (ВКЛ)</button>
    <button id="btn-toggle-cam">2. КАМЕРА (НЕБО)</button>
    <button id="btn-toggle-rf">3. РАДИО (ESP32/WI-FI)</button>
    <button id="btn-toggle-sdr">4. USB SDR (OTG)</button>
    <button id="btn-test" class="test-btn">ТЕСТ ТРЕВОГИ</button>
    <button id="btn-reset" class="reset-btn">СБРОС</button>
  </div>

  <div id="log-info" class="log-bar">Инициализация завершена. Выберите метод обнаружения.</div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    // Состояния
    let isMicActive = false;
    let isCamActive = false;
    let isRfActive = false;
    let isTestActive = false;
    let sirenEnabled = false;
    let triggerThreshold = 65;

    // Ссылки на элементы UI
    const threatPanel = document.getElementById('threat-panel');
    const threatStatus = document.getElementById('threat-status');
    const threatSource = document.getElementById('threat-source');
    const meterVal = document.getElementById('meter-val');
    const meterFill = document.getElementById('meter-fill');
    const logInfo = document.getElementById('log-info');

    const badgeMic = document.getElementById('badge-mic');
    const badgeCam = document.getElementById('badge-cam');
    const badgeRf = document.getElementById('badge-rf');
    const badgeSdr = document.getElementById('badge-sdr');

    // Логика общей тревоги
    function triggerAlarm(title, desc, percent) {
      threatPanel.classList.add('danger');
      threatStatus.innerText = title;
      threatSource.innerText = desc;
      meterVal.innerText = `${percent}%`;
      meterFill.style.width = `${percent}%`;

      if (navigator.vibrate) {
        navigator.vibrate([200, 100, 200, 100, 400]);
      }
      playSiren();
    }

    function clearAlarm() {
      threatPanel.classList.remove('danger');
      threatStatus.innerText = "НАБЛЮДЕНИЕ";
      threatSource.innerText = "Эфир и воздушное пространство чисты";
      meterVal.innerText = "0%";
      meterFill.style.width = "0%";
    }

    // Звуковая сирена
    let audioContext;
    function playSiren() {
      if (!sirenEnabled) return;
      try {
        const ctx = audioContext || new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(900, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);
      } catch (e) {}
    }

    document.getElementById('btn-sound').addEventListener('click', (e) => {
      sirenEnabled = !sirenEnabled;
      e.target.innerText = sirenEnabled ? "СИРЕНА: ВКЛ" : "СИРЕНА: ВЫКЛ";
      e.target.style.color = sirenEnabled ? "#00ff66" : "#aaa";
    });

    document.getElementById('threshold').addEventListener('input', (e) => {
      triggerThreshold = parseInt(e.target.value);
      document.getElementById('threshold-text').innerText = `${triggerThreshold}%`;
    });

    // -------------------------------------------------------------
    // СПОСОБ 1: АКУСТИЧЕСКИЙ ДЕТЕКТОР (МИКРОФОН)
    // -------------------------------------------------------------
    let micAnalyser, micSource, audioData;
    const audioCanvas = document.getElementById('audio-canvas');
    const audioCtx = audioCanvas.getContext('2d');

    document.getElementById('btn-toggle-mic').addEventListener('click', async (e) => {
      if (isMicActive) {
        isMicActive = false;
        badgeMic.classList.remove('active');
        e.target.classList.remove('active-btn');
        logInfo.innerText = "Акустический сканер остановлен.";
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        micAnalyser = audioContext.createAnalyser();
        micAnalyser.fftSize = 2048;
        micSource = audioContext.createMediaStreamSource(stream);
        micSource.connect(micAnalyser);
        audioData = new Uint8Array(micAnalyser.frequencyBinCount);

        isMicActive = true;
        badgeMic.classList.add('active');
        e.target.classList.add('active-btn');
        logInfo.innerText = "Акустический мониторинг активен.";
        drawAudioSpectrum();
      } catch (err) {
        logInfo.innerText = "Ошибка микрофона: " + err.message;
      }
    });

    function drawAudioSpectrum() {
      if (!isMicActive) return;
      requestAnimationFrame(drawAudioSpectrum);

      micAnalyser.getByteFrequencyData(audioData);
      audioCanvas.width = audioCanvas.clientWidth;
      audioCanvas.height = audioCanvas.clientHeight;
      audioCtx.fillStyle = '#040605';
      audioCtx.fillRect(0, 0, audioCanvas.width, audioCanvas.height);

      const sampleRate = audioContext.sampleRate;
      const binWidth = sampleRate / micAnalyser.fftSize;
      const bars = Math.floor(audioData.length / 4);
      const barWidth = audioCanvas.width / bars;

      let x = 0;
      let droneEnergy = 0;
      let droneBins = 0;

      for (let i = 0; i < bars; i++) {
        const freq = i * binWidth;
        const val = audioData[i];
        const h = (val / 255) * audioCanvas.height;
        const y = audioCanvas.height - h;

        if (freq >= 150 && freq <= 350) {
          audioCtx.fillStyle = '#ff2200';
          droneEnergy += val;
          droneBins++;
        } else {
          audioCtx.fillStyle = '#00aa44';
        }

        audioCtx.fillRect(x, y, barWidth - 0.5, h);
        x += barWidth;
      }

      if (droneBins > 0 && !isTestActive) {
        const avg = droneEnergy / droneBins;
        const percent = Math.min(100, Math.round((avg / 255) * 100));
        if (percent >= triggerThreshold) {
          triggerAlarm("АКУСТИЧЕСКАЯ ТРЕВОГА!", "Гул моторов БПЛА (150-350 Гц)", percent);
        }
      }
    }

    // -------------------------------------------------------------
    // СПОСОБ 2: ОПТИЧЕСКИЙ ДЕТЕКТОР (КАМЕРА + CV В БРАУЗЕРЕ)
    // -------------------------------------------------------------
    const videoElem = document.getElementById('video-stream');
    const camCanvas = document.getElementById('cam-canvas');
    const camCtx = camCanvas.getContext('2d');
    const camBox = document.getElementById('cam-box');
    let lastFrameData = null;

    document.getElementById('btn-toggle-cam').addEventListener('click', async (e) => {
      if (isCamActive) {
        isCamActive = false;
        badgeCam.classList.remove('active');
        e.target.classList.remove('active-btn');
        camBox.style.display = 'none';
        if (videoElem.srcObject) {
          videoElem.srcObject.getTracks().forEach(t => t.stop());
        }
        logInfo.innerText = "Оптический сканер остановлен.";
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
        });
        videoElem.srcObject = stream;
        await videoElem.play();
        isCamActive = true;
        camBox.style.display = 'flex';
        badgeCam.classList.add('active');
        e.target.classList.add('active-btn');
        logInfo.innerText = "Оптический трекинг неба запущен.";
        processVideoFrame();
      } catch (err) {
        logInfo.innerText = "Ошибка камеры: " + err.message;
      }
    });

    function processVideoFrame() {
      if (!isCamActive) return;
      requestAnimationFrame(processVideoFrame);

      if (videoElem.readyState === videoElem.HAVE_ENOUGH_DATA) {
        camCanvas.width = 320;
        camCanvas.height = 240;
        camCtx.drawImage(videoElem, 0, 0, camCanvas.width, camCanvas.height);

        const currentFrame = camCtx.getImageData(0, 0, camCanvas.width, camCanvas.height);
        const data = currentFrame.data;

        if (lastFrameData) {
          let movementScore = 0;
          let targetX = 0, targetY = 0, pointsCount = 0;

          // Покадровое дифференцирование (Вычитание фона)
          for (let i = 0; i < data.length; i += 16) {
            const diff = Math.abs(data[i] - lastFrameData.data[i]);
            if (diff > 45) { // Порог резкого движения контрастной точки
              movementScore++;
              const pixelIdx = i / 4;
              targetX += (pixelIdx % camCanvas.width);
              targetY += Math.floor(pixelIdx / camCanvas.width);
              pointsCount++;
            }
          }

          if (pointsCount > 8 && pointsCount < 300 && !isTestActive) {
            // Отрисовка прицельной сетки вокруг обнаруженной цели
            const avgX = targetX / pointsCount;
            const avgY = targetY / pointsCount;
            camCtx.strokeStyle = '#ff2200';
            camCtx.lineWidth = 2;
            camCtx.strokeRect(avgX - 15, avgY - 15, 30, 30);

            const percent = Math.min(100, Math.round((pointsCount / 150) * 100));
            if (percent >= 30) {
              triggerAlarm("ОПТИЧЕСКАЯ ТРЕВОГА!", "Движущийся объект в небе", percent);
            }
          }
        }
        lastFrameData = currentFrame;
      }
    }

    // -------------------------------------------------------------
    // СПОСОБ 3: РАДИОСКАНЕР ЧЕРЕЗ WI-FI МОСТ (ESP32 / WEBSOCKET)
    // -------------------------------------------------------------
    let wsClient = null;
    document.getElementById('btn-toggle-rf').addEventListener('click', (e) => {
      if (isRfActive) {
        if (wsClient) wsClient.close();
        isRfActive = false;
        badgeRf.classList.remove('active');
        e.target.classList.remove('active-btn');
        logInfo.innerText = "Радио-мост отключен.";
        return;
      }

      const espIp = prompt("Введите IP-адрес модуля ESP32 (по умолчанию 192.168.4.1):", "192.168.4.1");
      if (!espIp) return;

      logInfo.innerText = `Подключение к ws://${espIp}:81...`;
      try {
        wsClient = new WebSocket(`ws://${espIp}:81`);
        wsClient.onopen = () => {
          isRfActive = true;
          badgeRf.classList.add('active');
          e.target.classList.add('active-btn');
          logInfo.innerText = "Связь с выносным радиомодулем установлена!";
        };
        wsClient.onmessage = (event) => {
          // Формат от ESP32: {"freq": 915, "rssi": -45, "alert": true}
          try {
            const res = JSON.parse(event.data);
            if (res.alert) {
              const p = Math.min(100, Math.max(10, 100 + parseInt(res.rssi)));
              triggerAlarm("РАДИОПЕРЕХВАТ (ESP32)!", `Частота: ${res.freq} МГц (Сигнал FPV/ELRS)`, p);
            }
          } catch(err) {}
        };
        wsClient.onerror = () => {
          logInfo.innerText = "Ошибка подключения к Wi-Fi радиомодулю.";
        };
      } catch(err) {
        logInfo.innerText = "WebSocket недоступен: " + err.message;
      }
    });

    // -------------------------------------------------------------
    // СПОСОБ 4: ПРЯМОЙ USB SDR (ЧЕРЕЗ WEBUSB ДЛЯ ANDROID)
    // -------------------------------------------------------------
    document.getElementById('btn-toggle-sdr').addEventListener('click', async () => {
      if (!navigator.usb) {
        alert("WebUSB не поддерживается на iOS (Apple). Используйте способ 3 (ESP32 Wi-Fi) или Android.");
        return;
      }
      try {
        const device = await navigator.usb.requestDevice({
          filters: [{ vendorId: 0x0bda, productId: 0x2838 }, { vendorId: 0x0bda, productId: 0x2832 }]
        });
        await device.open();
        await device.selectConfiguration(1);
        await device.claimInterface(0);
        badgeSdr.classList.add('active');
        logInfo.innerText = `RTL-SDR подключен по USB: ${device.productName || 'USB'}`;
      } catch (err) {
        logInfo.innerText = "USB SDR: " + err.message;
      }
    });

    // ТЕСТ И СБРОС
    let testTimer = null;
    document.getElementById('btn-test').addEventListener('click', () => {
      if (isTestActive) return;
      isTestActive = true;
      let p = 35;
      testTimer = setInterval(() => {
        p += 15;
        if (p > 95) p = 95;
        triggerAlarm("ТЕСТОВАЯ ТРЕВОГА!", "Симуляция перехвата FPV (915 МГц)", p);
      }, 500);
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      if (testTimer) clearInterval(testTimer);
      isTestActive = false;
      clearAlarm();
      logInfo.innerText = "Тревога сброшена оператором.";
    });
  </script>
</body>
</html>
