<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0e0c">
  <title>Акустический Детектор БПЛА</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #080c0a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      padding: 12px;
      padding-top: max(12px, env(safe-area-inset-top));
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    /* Верхняя панель */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111915;
      border: 1px solid #1f3327;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
    }
    .status-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #555;
      margin-right: 6px;
      vertical-align: middle;
    }
    .status-dot.online {
      background: #00ff66;
      box-shadow: 0 0 8px #00ff66;
    }

    /* Главный щит статуса */
    .main-display {
      background: #0d1410;
      border: 2px solid #00ff66;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      margin: 8px 0;
      transition: background-color 0.2s, border-color 0.2s;
    }
    .main-display.danger {
      background: #2a0805;
      border-color: #ff3322;
      animation: pulse-border 0.8s infinite alternate;
    }
    @keyframes pulse-border {
      from { box-shadow: 0 0 4px #ff3322; }
      to { box-shadow: 0 0 20px #ff3322; }
    }
    .state-title {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #00ff66;
      margin-bottom: 4px;
    }
    .main-display.danger .state-title {
      color: #ff3322;
    }
    .state-subtitle {
      font-size: 13px;
      color: #8fa89b;
    }

    /* Шкала уровня шума моторов */
    .meter-box {
      margin-top: 12px;
      text-align: left;
    }
    .meter-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: #aaa;
      margin-bottom: 4px;
    }
    .meter-track {
      width: 100%;
      height: 16px;
      background: #141f18;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #233b2d;
    }
    .meter-bar {
      height: 100%;
      width: 0%;
      background: #00ff66;
      transition: width 0.08s ease-out;
    }
    .main-display.danger .meter-bar {
      background: #ff3322;
    }

    /* Спектрограмма звука */
    .spectrum-card {
      flex: 1;
      background: #050806;
      border: 1px solid #1f3327;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      padding: 8px;
      margin-bottom: 8px;
      min-height: 80px;
    }
    .spectrum-title {
      font-size: 11px;
      color: #6a8577;
      margin-bottom: 4px;
      text-transform: uppercase;
      font-weight: bold;
    }
    canvas {
      width: 100%;
      flex: 1;
      border-radius: 4px;
      background: #020302;
    }

    /* Блок управления чувствительностью */
    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #111915;
      border: 1px solid #1f3327;
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 8px;
      font-size: 12px;
    }
    .settings-row input[type=range] {
      flex: 1;
      margin-left: 12px;
      accent-color: #00ff66;
    }

    /* Кнопки управления */
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    button {
      background: #132219;
      color: #00ff66;
      border: 1px solid #00ff66;
      border-radius: 8px;
      padding: 14px 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    button:active {
      background: #00ff66;
      color: #000;
    }
    button.btn-test {
      background: #1f1b14;
      border-color: #ffaa00;
      color: #ffaa00;
    }
    button.btn-test:active {
      background: #ffaa00;
      color: #000;
    }
    button.btn-stop {
      background: #241010;
      border-color: #883333;
      color: #ff7777;
    }

    /* Журнал */
    .log-text {
      font-size: 11px;
      color: #6a8577;
      margin-top: 6px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <!-- Верхняя строка состояния -->
  <div class="top-bar">
    <div><span id="mic-indicator" class="status-dot"></span> МИКРОФОН</div>
    <div>РЕЖИМ: АВТОНОМНЫЙ</div>
  </div>

  <!-- Главный экран тревоги -->
  <div id="main-card" class="main-display">
    <div id="status-head" class="state-title">НАБЛЮДЕНИЕ</div>
    <div id="status-sub" class="state-subtitle">Эфир чист. Нажмите «ВКЛЮЧИТЬ СКАНЕР»</div>
    
    <div class="meter-box">
      <div class="meter-label">
        <span>АКУСТИЧЕСКИЙ СИГНАЛ БПЛА (150–350 Гц)</span>
        <span id="meter-num">0%</span>
      </div>
      <div class="meter-track">
        <div id="meter-fill" class="meter-bar"></div>
      </div>
    </div>
  </div>

  <!-- График спектра частот -->
  <div class="spectrum-card">
    <div class="spectrum-title">Спектрограмма частот реального времени (Красная зона = Моторы БПЛА)</div>
    <canvas id="spec-canvas"></canvas>
  </div>

  <!-- Чувствительность -->
  <div class="settings-row">
    <span>Порог срабатывания:</span>
    <input type="range" id="sensitivity-slider" min="30" max="95" value="65">
    <span id="sens-val" style="margin-left: 8px; font-weight: bold; width: 30px;">65%</span>
  </div>

  <!-- Кнопки управления -->
  <div class="btn-grid">
    <button id="btn-toggle">ВКЛЮЧИТЬ СКАНЕР</button>
    <button id="btn-sim" class="btn-test">ТЕСТ СИРЕНЫ</button>
    <button id="btn-reset" class="btn-stop">СБРОС ТРЕВОГИ</button>
    <button id="btn-sound-toggle">ЗВУК: ВЫКЛ</button>
  </div>

  <div id="log-line" class="log-text">Готов к работе. Требуется доступ к микрофону.</div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    let audioCtx, analyser, micStream, dataArr;
    let isListening = false;
    let isTesting = false;
    let testTimer = null;
    let audioAlertEnabled = false;
    let thresholdPercent = 65;

    const mainCard = document.getElementById('main-card');
    const statusHead = document.getElementById('status-head');
    const statusSub = document.getElementById('status-sub');
    const meterNum = document.getElementById('meter-num');
    const meterFill = document.getElementById('meter-fill');
    const micIndicator = document.getElementById('mic-indicator');
    const logLine = document.getElementById('log-line');
    const btnToggle = document.getElementById('btn-toggle');
    const btnSound = document.getElementById('btn-sound-toggle');
    const sensSlider = document.getElementById('sensitivity-slider');
    const sensVal = document.getElementById('sens-val');

    const canvas = document.getElementById('spec-canvas');
    const ctx = canvas.getContext('2d');

    // Настройка порога
    sensSlider.addEventListener('input', (e) => {
      thresholdPercent = parseInt(e.target.value);
      sensVal.innerText = `${thresholdPercent}%`;
    });

    // Звуковая сирена через Web Audio
    function playBeep() {
      if (!audioAlertEnabled) return;
      try {
        const osc = (audioCtx || new AudioContext()).createOscillator();
        const gain = (audioCtx || new AudioContext()).createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(880, (audioCtx || new AudioContext()).currentTime);
        osc.connect(gain);
        gain.connect((audioCtx || new AudioContext()).destination);
        gain.gain.setValueAtTime(0.3, (audioCtx || new AudioContext()).currentTime);
        osc.start();
        osc.stop((audioCtx || new AudioContext()).currentTime + 0.25);
      } catch (e) {}
    }

    btnSound.addEventListener('click', () => {
      audioAlertEnabled = !audioAlertEnabled;
      btnSound.innerText = audioAlertEnabled ? "ЗВУК: ВКЛ" : "ЗВУК: ВЫКЛ";
      btnSound.style.color = audioAlertEnabled ? "#00ff66" : "#aaa";
    });

    function setAlert(title, subtitle, percent) {
      mainCard.classList.add('danger');
      statusHead.innerText = title;
      statusSub.innerText = subtitle;
      meterNum.innerText = `${percent}%`;
      meterFill.style.width = `${percent}%`;

      if (navigator.vibrate) {
        navigator.vibrate([250, 100, 250, 100, 500]);
      }
      playBeep();
    }

    function resetAlert() {
      mainCard.classList.remove('danger');
      statusHead.innerText = isListening ? "СКАНИРОВАНИЕ..." : "НАБЛЮДЕНИЕ";
      statusSub.innerText = isListening ? "Анализ звуковых гармоник винтов" : "Сканер отключен";
      meterNum.innerText = "0%";
      meterFill.style.width = "0%";
    }

    // Запуск микрофона
    btnToggle.addEventListener('click', async () => {
      if (isListening) {
        stopScanner();
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        micStream = audioCtx.createMediaStreamSource(stream);
        micStream.connect(analyser);

        dataArr = new Uint8Array(analyser.frequencyBinCount);
        isListening = true;
        micIndicator.classList.add('online');
        btnToggle.innerText = "ОСТАНОВИТЬ";
        btnToggle.style.borderColor = "#ff4444";
        btnToggle.style.color = "#ff4444";
        logLine.innerText = "Микрофон активен. Идет прослушивание эфира...";
        resetAlert();
        renderLoop();
      } catch (err) {
        logLine.innerText = "Ошибка доступа к микрофону: " + err.message;
      }
    });

    function stopScanner() {
      isListening = false;
      micIndicator.classList.remove('online');
      btnToggle.innerText = "ВКЛЮЧИТЬ СКАНЕР";
      btnToggle.style.borderColor = "#00ff66";
      btnToggle.style.color = "#00ff66";
      logLine.innerText = "Сканер остановлен.";
      resetAlert();
    }

    function renderLoop() {
      if (!isListening) return;
      requestAnimationFrame(renderLoop);

      analyser.getByteFrequencyData(dataArr);

      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
      ctx.fillStyle = '#020302';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const sampleRate = audioCtx.sampleRate;
      const binWidth = sampleRate / analyser.fftSize;
      const totalBars = Math.floor(dataArr.length / 4);
      const barWidth = canvas.width / totalBars;

      let x = 0;
      let droneEnergy = 0;
      let droneBinsCount = 0;

      for (let i = 0; i < totalBars; i++) {
        const freq = i * binWidth;
        const val = dataArr[i];
        const barHeight = (val / 255) * canvas.height;
        const y = canvas.height - barHeight;

        // Зона характерных частот вращения пропеллеров (150-350 Гц)
        if (freq >= 150 && freq <= 350) {
          ctx.fillStyle = '#ff3322';
          droneEnergy += val;
          droneBinsCount++;
        } else {
          ctx.fillStyle = '#00aa44';
        }

        ctx.fillRect(x, y, barWidth - 0.5, barHeight);
        x += barWidth;
      }

      if (droneBinsCount > 0 && !isTesting) {
        const avg = droneEnergy / droneBinsCount;
        const percent = Math.min(100, Math.round((avg / 255) * 100));

        meterNum.innerText = `${percent}%`;
        meterFill.style.width = `${percent}%`;

        if (percent >= thresholdPercent) {
          setAlert("ТРЕВОГА: ЗВУК БПЛА!", "Обнаружен характерный гул винтов (150-350 Гц)", percent);
          logLine.innerText = `ВНИМАНИЕ! Превышен порог: ${percent}%`;
        } else if (mainCard.classList.contains('danger') && percent < (thresholdPercent - 15)) {
          resetAlert();
        }
      }
    }

    // Тест-имитатор
    document.getElementById('btn-sim').addEventListener('click', () => {
      if (isTesting) return;
      isTesting = true;
      logLine.innerText = "Имитация: приближение дрона...";
      let p = 35;
      testTimer = setInterval(() => {
        p += 15;
        if (p > 92) p = 92;
        setAlert("ТЕСТОВАЯ ТРЕВОГА!", "Симуляция приближения БПЛА (FPV 915 МГц)", p);
      }, 500);
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      if (testTimer) clearInterval(testTimer);
      isTesting = false;
      resetAlert();
      logLine.innerText = "Тревога сброшена оператором.";
    });
  </script>
</body>
</html>
