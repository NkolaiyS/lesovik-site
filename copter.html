<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0e0c">
  <title>Комплексный Детектор БПЛА</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #080c0a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      padding: 10px;
      padding-top: max(10px, env(safe-area-inset-top));
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
    }

    /* Верхняя панель статусов */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111915;
      border: 1px solid #1f3327;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .status-group {
      display: flex;
      gap: 8px;
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #444;
      margin-right: 4px;
      vertical-align: middle;
    }
    .status-dot.online {
      background: #00ff66;
      box-shadow: 0 0 6px #00ff66;
    }

    /* Главный щит статуса */
    .main-display {
      background: #0d1410;
      border: 2px solid #00ff66;
      border-radius: 12px;
      padding: 12px 14px;
      text-align: center;
      margin-bottom: 6px;
      transition: background-color 0.2s, border-color 0.2s;
    }
    .main-display.danger {
      background: #2a0805;
      border-color: #ff3322;
      animation: pulse-border 0.8s infinite alternate;
    }
    @keyframes pulse-border {
      from { box-shadow: 0 0 4px #ff3322; }
      to { box-shadow: 0 0 20px #ff3322; }
    }
    .state-title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #00ff66;
      margin-bottom: 2px;
    }
    .main-display.danger .state-title {
      color: #ff3322;
    }
    .state-subtitle {
      font-size: 12px;
      color: #8fa89b;
    }

    /* Шкала уровня сигнала */
    .meter-box {
      margin-top: 8px;
      text-align: left;
    }
    .meter-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 600;
      color: #aaa;
      margin-bottom: 3px;
    }
    .meter-track {
      width: 100%;
      height: 14px;
      background: #141f18;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #233b2d;
    }
    .meter-bar {
      height: 100%;
      width: 0%;
      background: #00ff66;
      transition: width 0.08s ease-out;
    }
    .main-display.danger .meter-bar {
      background: #ff3322;
    }

    /* Визуальный контейнер */
    .visual-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 6px;
      min-height: 110px;
    }

    /* Оптический модуль */
    .cam-card {
      height: 110px;
      background: #040605;
      border: 1px solid #1f3327;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .cam-card canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .cam-tag {
      position: absolute;
      top: 4px;
      left: 6px;
      font-size: 9px;
      background: rgba(0,0,0,0.7);
      padding: 2px 5px;
      border-radius: 3px;
      color: #00ff66;
      font-weight: bold;
    }

    /* Спектрограмма звука */
    .spectrum-card {
      flex: 1;
      background: #050806;
      border: 1px solid #1f3327;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      padding: 6px;
      min-height: 80px;
    }
    .spectrum-title {
      font-size: 10px;
      color: #6a8577;
      margin-bottom: 3px;
      text-transform: uppercase;
      font-weight: bold;
    }
    #spec-canvas {
      width: 100%;
      flex: 1;
      border-radius: 4px;
      background: #020302;
    }

    /* Блок управления чувствительностью */
    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #111915;
      border: 1px solid #1f3327;
      border-radius: 8px;
      padding: 6px 10px;
      margin-bottom: 6px;
      font-size: 11px;
    }
    .settings-row input[type=range] {
      flex: 1;
      margin: 0 8px;
      accent-color: #00ff66;
    }

    /* Кнопки управления */
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    button {
      background: #132219;
      color: #00ff66;
      border: 1px solid #00ff66;
      border-radius: 8px;
      padding: 10px 4px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    button:active {
      background: #00ff66;
      color: #000;
    }
    button.btn-active {
      background: #004d1f;
      border-color: #00ff66;
      color: #fff;
    }
    button.btn-test {
      background: #1f1b14;
      border-color: #ffaa00;
      color: #ffaa00;
    }
    button.btn-stop {
      background: #241010;
      border-color: #883333;
      color: #ff7777;
    }

    /* Журнал */
    .log-text {
      font-size: 10px;
      color: #6a8577;
      margin-top: 4px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <!-- Верхняя строка состояния всех контуров -->
  <div class="top-bar">
    <div class="status-group">
      <div><span id="mic-indicator" class="status-dot"></span> ЗВУК</div>
      <div><span id="cam-indicator" class="status-dot"></span> КАМЕРА</div>
      <div><span id="rf-indicator" class="status-dot"></span> РАДИО</div>
      <div><span id="sdr-indicator" class="status-dot"></span> SDR</div>
    </div>
    <div>РЕЖИМ: ОФФЛАЙН</div>
  </div>

  <!-- Главный экран тревоги -->
  <div id="main-card" class="main-display">
    <div id="status-head" class="state-title">НАБЛЮДЕНИЕ</div>
    <div id="status-sub" class="state-subtitle">Эфир чист. Выберите режим сканирования</div>
    
    <div class="meter-box">
      <div class="meter-label">
        <span id="meter-source-title">ИНТЕНСИВНОСТЬ СИГНАЛА</span>
        <span id="meter-num">0%</span>
      </div>
      <div class="meter-track">
        <div id="meter-fill" class="meter-bar"></div>
      </div>
    </div>
  </div>

  <!-- Визуальный блок -->
  <div class="visual-box">
    <!-- Оптический экран (появляется только при включении камеры) -->
    <div id="cam-card" class="cam-card">
      <span class="cam-tag">ОПТИЧЕСКИЙ ТРЕКИНГ НЕБА</span>
      <video id="cam-video" autoplay playsinline muted style="display:none;"></video>
      <canvas id="cam-canvas"></canvas>
    </div>

    <!-- Акустическая спектрограмма -->
    <div class="spectrum-card">
      <div class="spectrum-title">Спектрограмма частот (Красная зона = Моторы БПЛА 150–350 Гц)</div>
      <canvas id="spec-canvas"></canvas>
    </div>
  </div>

  <!-- Чувствительность и сирена -->
  <div class="settings-row">
    <span>Порог:</span>
    <input type="range" id="sensitivity-slider" min="30" max="95" value="65">
    <span id="sens-val" style="margin-left: 4px; font-weight: bold; width: 28px;">65%</span>
    <button id="btn-sound-toggle" style="padding: 3px 8px; font-size: 10px; margin-left: 6px;">ЗВУК: ВЫКЛ</button>
  </div>

  <!-- Кнопки управления всеми модулями -->
  <div class="btn-grid">
    <button id="btn-toggle-mic">1. АКУСТИКА</button>
    <button id="btn-toggle-cam">2. КАМЕРА (НЕБО)</button>
    <button id="btn-toggle-rf">3. РАДИО (ESP32)</button>
    <button id="btn-toggle-sdr">4. USB SDR (OTG)</button>
    <button id="btn-sim" class="btn-test">ТЕСТ СИРЕНЫ</button>
    <button id="btn-reset" class="btn-stop">СБРОС ТРЕВОГИ</button>
  </div>

  <div id="log-line" class="log-text">Готов к работе. Включите необходимый контур.</div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    // Состояния датчиков
    let isListening = false;
    let isCamActive = false;
    let isRfActive = false;
    let isTesting = false;
    let audioAlertEnabled = false;
    let thresholdPercent = 65;
    let testTimer = null;

    // Ссылки на элементы UI
    const mainCard = document.getElementById('main-card');
    const statusHead = document.getElementById('status-head');
    const statusSub = document.getElementById('status-sub');
    const meterNum = document.getElementById('meter-num');
    const meterFill = document.getElementById('meter-fill');
    const logLine = document.getElementById('log-line');

    const micIndicator = document.getElementById('mic-indicator');
    const camIndicator = document.getElementById('cam-indicator');
    const rfIndicator = document.getElementById('rf-indicator');
    const sdrIndicator = document.getElementById('sdr-indicator');

    const btnToggleMic = document.getElementById('btn-toggle-mic');
    const btnToggleCam = document.getElementById('btn-toggle-cam');
    const btnToggleRf = document.getElementById('btn-toggle-rf');
    const btnToggleSdr = document.getElementById('btn-toggle-sdr');
    const btnSound = document.getElementById('btn-sound-toggle');
    const sensSlider = document.getElementById('sensitivity-slider');
    const sensVal = document.getElementById('sens-val');

    // Настройка порога
    sensSlider.addEventListener('input', (e) => {
      thresholdPercent = parseInt(e.target.value);
      sensVal.innerText = `${thresholdPercent}%`;
    });

    // Звуковая сирена (Web Audio)
    let audioCtx;
    function playBeep() {
      if (!audioAlertEnabled) return;
      try {
        const ctx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      } catch (e) {}
    }

    btnSound.addEventListener('click', () => {
      audioAlertEnabled = !audioAlertEnabled;
      btnSound.innerText = audioAlertEnabled ? "ЗВУК: ВКЛ" : "ЗВУК: ВЫКЛ";
      btnSound.style.color = audioAlertEnabled ? "#00ff66" : "#aaa";
    });

    function setAlert(title, subtitle, percent) {
      mainCard.classList.add('danger');
      statusHead.innerText = title;
      statusSub.innerText = subtitle;
      meterNum.innerText = `${percent}%`;
      meterFill.style.width = `${percent}%`;

      if (navigator.vibrate) {
        navigator.vibrate([250, 100, 250, 100, 500]);
      }
      playBeep();
    }

    function resetAlert() {
      mainCard.classList.remove('danger');
      statusHead.innerText = (isListening || isCamActive || isRfActive) ? "СКАНИРОВАНИЕ..." : "НАБЛЮДЕНИЕ";
      statusSub.innerText = "Эфир и воздушное пространство чисты";
      meterNum.innerText = "0%";
      meterFill.style.width = "0%";
    }

    // =============================================================
    // 1. АКУСТИЧЕСКИЙ МОДУЛЬ (МИКРОФОН + FFT + ФИЛЬТР ШУМА)
    // =============================================================
    let analyser, micStream, dataArr;
    const canvas = document.getElementById('spec-canvas');
    const ctx = canvas.getContext('2d');

    btnToggleMic.addEventListener('click', async () => {
      if (isListening) {
        isListening = false;
        micIndicator.classList.remove('online');
        btnToggleMic.classList.remove('btn-active');
        btnToggleMic.innerText = "1. АКУСТИКА";
        logLine.innerText = "Акустический сканер остановлен.";
        resetAlert();
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        micStream = audioCtx.createMediaStreamSource(stream);
        micStream.connect(analyser);

        dataArr = new Uint8Array(analyser.frequencyBinCount);
        isListening = true;
        micIndicator.classList.add('online');
        btnToggleMic.classList.add('btn-active');
        btnToggleMic.innerText = "1. АКУСТИКА (ВКЛ)";
        logLine.innerText = "Микрофон активен. Идет анализ гармоник...";
        resetAlert();
        renderLoop();
      } catch (err) {
        logLine.innerText = "Ошибка доступа к микрофону: " + err.message;
      }
    });

    function renderLoop() {
      if (!isListening) return;
      requestAnimationFrame(renderLoop);

      analyser.getByteFrequencyData(dataArr);

      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
      ctx.fillStyle = '#020302';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const sampleRate = audioCtx.sampleRate;
      const binWidth = sampleRate / analyser.fftSize;
      const totalBars = Math.floor(dataArr.length / 4);
      const barWidth = canvas.width / totalBars;

      let x = 0;
      let peakDroneVal = 0;
      let totalNoise = 0;

      for (let i = 0; i < totalBars; i++) {
        const freq = i * binWidth;
        const val = dataArr[i];
        const barHeight = (val / 255) * canvas.height;
        const y = canvas.height - barHeight;

        totalNoise += val;

        if (freq >= 150 && freq <= 380) {
          ctx.fillStyle = '#ff3322';
          if (val > peakDroneVal) peakDroneVal = val;
        } else {
          ctx.fillStyle = '#00aa44';
        }

        ctx.fillRect(x, y, barWidth - 0.5, barHeight);
        x += barWidth;
      }

      const avgBackground = totalNoise / totalBars;
      // Фильтр SNR: острый пик в зоне моторов, превышающий общий шум
      const isSharpPeak = peakDroneVal > (avgBackground * 1.7) && peakDroneVal > 130;

      if (isSharpPeak && !isTesting) {
        const percent = Math.min(100, Math.round((peakDroneVal / 255) * 100));
        meterNum.innerText = `${percent}%`;
        meterFill.style.width = `${percent}%`;

        if (percent >= thresholdPercent) {
          setAlert("ТРЕВОГА: ЗВУК БПЛА!", "Характерный гул винтов (150-350 Гц)", percent);
        }
      } else if (mainCard.classList.contains('danger') && !isTesting && !isCamActive && !isRfActive) {
        resetAlert();
      }
    }

    // =============================================================
    // 2. ОПТИЧЕСКИЙ МОДУЛЬ (КАМЕРА + CV В БРАУЗЕРЕ)
    // =============================================================
    const camCard = document.getElementById('cam-card');
    const camVideo = document.getElementById('cam-video');
    const camCanvas = document.getElementById('cam-canvas');
    const camCtx = camCanvas.getContext('2d');
    let lastFrameData = null;

    btnToggleCam.addEventListener('click', async () => {
      if (isCamActive) {
        isCamActive = false;
        camIndicator.classList.remove('online');
        btnToggleCam.classList.remove('btn-active');
        btnToggleCam.innerText = "2. КАМЕРА (НЕБО)";
        camCard.style.display = 'none';
        if (camVideo.srcObject) {
          camVideo.srcObject.getTracks().forEach(t => t.stop());
        }
        logLine.innerText = "Оптический сканер отключен.";
        resetAlert();
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
        });
        camVideo.srcObject = stream;
        await camVideo.play();
        isCamActive = true;
        camCard.style.display = 'flex';
        camIndicator.classList.add('online');
        btnToggleCam.classList.add('btn-active');
        btnToggleCam.innerText = "2. КАМЕРА (ВКЛ)";
        logLine.innerText = "Оптический трекинг неба запущен.";
        processOpticalFrame();
      } catch (err) {
        logLine.innerText = "Ошибка камеры: " + err.message;
      }
    });

    function processOpticalFrame() {
      if (!isCamActive) return;
      requestAnimationFrame(processOpticalFrame);

      if (camVideo.readyState === camVideo.HAVE_ENOUGH_DATA) {
        camCanvas.width = 320;
        camCanvas.height = 240;
        camCtx.drawImage(camVideo, 0, 0, camCanvas.width, camCanvas.height);

        const currentFrame = camCtx.getImageData(0, 0, camCanvas.width, camCanvas.height);
        const data = currentFrame.data;

        if (lastFrameData) {
          let changedPixels = 0;
          let targetX = 0, targetY = 0, targetPoints = 0;

          for (let i = 0; i < data.length; i += 16) {
            const diff = Math.abs(data[i] - lastFrameData.data[i]);
            if (diff > 60) {
              changedPixels++;
              const pixelIdx = i / 4;
              targetX += (pixelIdx % camCanvas.width);
              targetY += Math.floor(pixelIdx / camCanvas.width);
              targetPoints++;
            }
          }

          // Фильтр дрожания рук и размера цели
          const isDroneSize = targetPoints >= 10 && targetPoints <= 250;
          const isNotGlobalShake = changedPixels < 800;

          if (isDroneSize && isNotGlobalShake && !isTesting) {
            const avgX = targetX / targetPoints;
            const avgY = targetY / targetPoints;

            camCtx.strokeStyle = '#ff2200';
            camCtx.lineWidth = 2;
            camCtx.strokeRect(avgX - 12, avgY - 12, 24, 24);

            const percent = Math.min(100, Math.round((targetPoints / 200) * 100));
            setAlert("ОПТИЧЕСКИЙ ЗАХВАТ!", "Точечный объект в небе", percent);
          } else if (mainCard.classList.contains('danger') && !isTesting && !isListening && !isRfActive) {
            resetAlert();
          }
        }
        lastFrameData = currentFrame;
      }
    }

    // =============================================================
    // 3. РАДИОСКАНЕР ЧЕРЕЗ WI-FI МОСТ (ESP32 / WEBSOCKET)
    // =============================================================
    let wsClient = null;
    btnToggleRf.addEventListener('click', () => {
      if (isRfActive) {
        if (wsClient) wsClient.close();
        isRfActive = false;
        rfIndicator.classList.remove('online');
        btnToggleRf.classList.remove('btn-active');
        btnToggleRf.innerText = "3. РАДИО (ESP32)";
        logLine.innerText = "Радио-мост отключен.";
        resetAlert();
        return;
      }

      const espIp = prompt("Введите IP-адрес модуля ESP32 (по умолчанию 192.168.4.1):", "192.168.4.1");
      if (!espIp) return;

      logLine.innerText = `Подключение к ws://${espIp}:81...`;
      try {
        wsClient = new WebSocket(`ws://${espIp}:81`);
        wsClient.onopen = () => {
          isRfActive = true;
          rfIndicator.classList.add('online');
          btnToggleRf.classList.add('btn-active');
          btnToggleRf.innerText = "3. РАДИО (ВКЛ)";
          logLine.innerText = "Связь с выносным радиомодулем установлена!";
        };
        wsClient.onmessage = (event) => {
          try {
            const res = JSON.parse(event.data);
            if (res.alert) {
              const p = Math.min(100, Math.max(10, 100 + parseInt(res.rssi)));
              setAlert("РАДИОПЕРЕХВАТ (FPV)!", `Частота: ${res.freq} МГц (Канал управления)`, p);
            }
          } catch(e) {}
        };
        wsClient.onerror = () => {
          logLine.innerText = "Ошибка подключения к Wi-Fi радиомодулю.";
        };
      } catch(err) {
        logLine.innerText = "WebSocket недоступен: " + err.message;
      }
    });

    // =============================================================
    // 4. ПРЯМОЙ USB SDR (ЧЕРЕЗ WEBUSB)
    // =============================================================
    btnToggleSdr.addEventListener('click', async () => {
      if (!navigator.usb) {
        alert("WebUSB не поддерживается на iOS (Apple). Для выноса используйте способ 3 (ESP32 Wi-Fi) или Android.");
        return;
      }
      try {
        const device = await navigator.usb.requestDevice({
          filters: [{ vendorId: 0x0bda, productId: 0x2838 }, { vendorId: 0x0bda, productId: 0x2832 }]
        });
        await device.open();
        await device.selectConfiguration(1);
        await device.claimInterface(0);
        sdrIndicator.classList.add('online');
        btnToggleSdr.classList.add('btn-active');
        btnToggleSdr.innerText = "4. USB SDR (ВКЛ)";
        logLine.innerText = `RTL-SDR подключен: ${device.productName || 'USB'}`;
      } catch (err) {
        logLine.innerText = "USB SDR: " + err.message;
      }
    });

    // =============================================================
    // ТЕСТ И СБРОС
    // =============================================================
    document.getElementById('btn-sim').addEventListener('click', () => {
      if (isTesting) return;
      isTesting = true;
      logLine.innerText = "Имитация: приближение дрона...";
      let p = 35;
      testTimer = setInterval(() => {
        p += 15;
        if (p > 92) p = 92;
        setAlert("ТЕСТОВАЯ ТРЕВОГА!", "Симуляция приближения БПЛА (FPV 915 МГц)", p);
      }, 500);
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      if (testTimer) clearInterval(testTimer);
      isTesting = false;
      resetAlert();
      logLine.innerText = "Тревога сброшена оператором.";
    });
  </script>
</body>
</html>
