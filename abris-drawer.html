    <script>
        const canvas = document.getElementById('abris-canvas');
        const ctx = canvas.getContext('2d');
        let bgImage = null;
        let zoomLevel = 1.0;

        function addRow() {
            const tbody = document.getElementById('lines-body');
            const count = tbody.children.length + 1;
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${count}-${count === 1 ? 1 : count + 1}</td>
                <td><input type="number" value="0" class="inp-azimuth"></td>
                <td><input type="number" value="100" class="inp-length"></td>
            `;
            tbody.appendChild(tr);
            updateLabels();
        }

        function removeRow() {
            const tbody = document.getElementById('lines-body');
            if (tbody.children.length > 3) {
                tbody.removeChild(tbody.lastChild);
                updateLabels();
            }
        }

        function updateLabels() {
            const tbody = document.getElementById('lines-body');
            const total = tbody.children.length;
            Array.from(tbody.children).forEach((tr, idx) => {
                const next = (idx + 1 === total) ? 1 : idx + 2;
                tr.children[0].innerText = `${idx + 1}-${next}`;
            });
        }

        function loadBackgroundImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    bgImage = new Image();
                    bgImage.onload = function() { drawAbris(); };
                    bgImage.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function drawAbris() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 1. Отрисовка подложки
            if (bgImage) {
                ctx.globalAlpha = 0.4;
                ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
                ctx.globalAlpha = 1.0;
            }

            // 2. Расчет точек по азимутам и длинам
            const azimuths = Array.from(document.querySelectorAll('.inp-azimuth')).map(i => parseFloat(i.value) || 0);
            const lengths = Array.from(document.querySelectorAll('.inp-length')).map(i => parseFloat(i.value) || 0);

            let points = [{ x: 0, y: 0 }];
            let currentX = 0, currentY = 0;
            let totalLength = 0;

            for (let i = 0; i < azimuths.length; i++) {
                const rad = (azimuths[i] * Math.PI) / 180;
                const dx = lengths[i] * Math.sin(rad);
                const dy = -lengths[i] * Math.cos(rad);
                currentX += dx;
                currentY += dy;
                points.push({ x: currentX, y: currentY });
                totalLength += lengths[i];
            }

            // Невязка
            const closureError = Math.sqrt(currentX * currentX + currentY * currentY);

            // Расчет площади (формула Гаусса)
            let area = 0;
            for (let i = 0; i < points.length - 1; i++) {
                area += (points[i].x * points[i+1].y) - (points[i+1].x * points[i].y);
            }
            area = Math.abs(area / 2) / 10000; // в гектары

            document.getElementById('calc-info').innerHTML = `
                Площадь: <b>${area.toFixed(2)} га</b><br>
                Периметр: <b>${Math.round(totalLength)} м</b><br>
                Невязка: <b>${closureError.toFixed(2)} м</b>
            `;

            // 3. Масштабирование и центрирование на холсте
            const minX = Math.min(...points.map(p => p.x));
            const maxX = Math.max(...points.map(p => p.x));
            const minY = Math.min(...points.map(p => p.y));
            const maxY = Math.max(...points.map(p => p.y));

            const polyWidth = maxX - minX || 1;
            const polyHeight = maxY - minY || 1;

            const scaleX = (canvas.width - 100) / polyWidth;
            const scaleY = (canvas.height - 100) / polyHeight;
            const scale = Math.min(scaleX, scaleY) * zoomLevel;

            const offsetX = (canvas.width - polyWidth * scale) / 2 - minX * scale;
            const offsetY = (canvas.height - polyHeight * scale) / 2 - minY * scale;

            // 4. Рисование контура
            ctx.beginPath();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#2D5A27';
            ctx.fillStyle = 'rgba(45, 90, 39, 0.15)';

            points.forEach((p, idx) => {
                const screenX = p.x * scale + offsetX;
                const screenY = p.y * scale + offsetY;
                if (idx === 0) ctx.moveTo(screenX, screenY);
                else ctx.lineTo(screenX, screenY);
            });

            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 5. Точки и подписи вершин
            points.slice(0, -1).forEach((p, idx) => {
                const screenX = p.x * scale + offsetX;
                const screenY = p.y * scale + offsetY;
                
                ctx.beginPath();
                ctx.arc(screenX, screenY, 5, 0, Math.PI * 2);
                ctx.fillStyle = '#D9534F';
                ctx.fill();

                ctx.fillStyle = '#333';
                ctx.font = 'bold 12px Inter';
                ctx.fillText(`Т. ${idx + 1}`, screenX + 8, screenY - 8);
            });

            // 6. Стрелка Севера
            drawNorthArrow();
        }

        function drawNorthArrow() {
            ctx.save();
            ctx.translate(40, 50);
            ctx.beginPath();
            ctx.moveTo(0, 0); ctx.lineTo(-8, 20); ctx.lineTo(0, 15); ctx.lineTo(8, 20);
            ctx.closePath();
            ctx.fillStyle = '#2D5A27'; ctx.fill();
            ctx.font = 'bold 12px Inter'; ctx.fillText('Сек', -4, -6);
            ctx.restore();
        }

        function zoomCanvas(factor) {
            zoomLevel *= factor;
            drawAbris();
        }

        function resetCanvas() {
            zoomLevel = 1.0;
            drawAbris();
        }

        function toggleTheme() {
            const body = document.documentElement;
            if (body.getAttribute('data-theme') === 'dark') body.removeAttribute('data-theme');
            else body.setAttribute('data-theme', 'dark');
        }

        // Старт при загрузке
        window.onload = function() { drawAbris(); };
    </script>
