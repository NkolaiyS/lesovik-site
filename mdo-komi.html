    <meta name="theme-color" content="#2D5A27">

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw-busol-pro.js')
            .then(reg => console.log('Перечетный журнал PRO ready for offline:', reg.scope))
            .catch(err => console.error('SW PRO registration failed:', err));
        });
      }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Перечетная ведомость леса онлайн: электронный полевой журнал таксатора | Лесовик ПРО</title>
    <meta name="description" content="Электронная перечетная ведомость деревьев с официальными таксационными нормативами лесничеств Республики Коми. Расчет объема по разрядам высот, категориям технической годности и формуле состава.">
    <link rel="canonical" href="https://lesovik-pro.ru/journal.html">
    <link rel="icon" type="image/jpeg" href="logo.jpeg">

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.mini.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Inter:wght@400;500;600;700;800;900&display=swap');

        :root {
            --bg-paper: #F9FBF9;
            --text-graphite: #333333;
            --forest-green: #2D5A27;
            --forest-light: #8FBC8F;
            --border-color: #E0E0E0;
            --card-bg: #FFFFFF;
            --glass-bg: rgba(249, 251, 249, 0.94);
            --footer-bg: #2C3531;
            --danger: #DC2626;
            --info: #2563EB;
            --success: #16A34A;
            --accent: #E67E22;
        }

        [data-theme="dark"] {
            --bg-paper: #1A2421;
            --text-graphite: #F9FBF9;
            --forest-green: #8FBC8F;
            --forest-light: #2D5A27;
            --border-color: #3A4F46;
            --card-bg: #22302B;
            --glass-bg: rgba(26, 36, 33, 0.94);
            --footer-bg: #111815;
            --accent: #F59E0B;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-paper);
            color: var(--text-graphite);
            margin: 0; padding: 0;
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
            display: flex; flex-direction: column;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: 75px !important;
        }

        .glass-header-deck {
            position: sticky; top: 0; z-index: 1000;
            background: var(--glass-bg);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            width: 100%;
        }

        .header-tier-top {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 20px 6px 20px;
        }

        .logo-container { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .header-logo { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 2px solid var(--forest-green); }
        .header-main-title { font-family: 'Merriweather', serif; color: var(--forest-green); margin: 0; font-size: 19px; line-height: 1.1; }

        .header-sub-banner {
            padding: 0 20px 8px 20px; font-size: 11px; font-weight: 700;
            color: var(--text-graphite); opacity: 0.8; text-transform: uppercase;
            letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .header-tier-actions { display: flex; align-items: center; gap: 8px; }

        .header-tier-bottom {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 20px 10px 20px; overflow-x: auto; scrollbar-width: none;
            border-top: 1px solid rgba(0,0,0,0.04);
        }
        .header-tier-bottom::-webkit-scrollbar { display: none; }

        .btn-nav {
            background: transparent; border: 1px solid var(--forest-green); color: var(--forest-green);
            padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 11px; font-weight: 700;
            text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 5px;
            white-space: nowrap; height: 30px; transition: 0.2s; text-transform: uppercase;
        }
        .btn-nav:hover, .btn-nav.active { background-color: var(--forest-green); color: #FFF; }

        main { flex: 1; }
        .container { max-width: 1020px; margin: 20px auto 40px auto; padding: 0 15px; width: 100%; box-sizing: border-box; }

        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 22px; margin-bottom: 22px; box-shadow: 0 4px 14px rgba(0,0,0,0.03); }
        h2 { font-family: 'Merriweather', serif; color: var(--forest-green); margin-top: 0; font-size: 20px; margin-bottom: 16px; }

        .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }
        label { display: block; font-size: 11px; font-weight: 700; color: var(--forest-green); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        select, input { width: 100%; padding: 11px 12px; border: 1px solid var(--border-color); border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 13.5px; background-color: var(--bg-paper); color: var(--text-graphite); box-sizing: border-box; font-weight: 500; }
        select:focus, input:focus { outline: none; border-color: var(--forest-green); }

        .species-picker-deck {
            background: var(--bg-paper); border: 1px solid var(--border-color);
            border-radius: 10px; padding: 14px; margin-bottom: 18px;
            display: flex; align-items: flex-end; gap: 12px;
        }
        @media (max-width: 620px) { .species-picker-deck { flex-direction: column; align-items: stretch; } }

        .btn-add-species {
            background-color: var(--forest-green); color: white; border: none; padding: 11px 18px;
            border-radius: 8px; font-weight: 800; font-size: 12px; cursor: pointer; text-transform: uppercase;
            white-space: nowrap; height: 42px; transition: 0.2s;
        }

        .mode-switch-box {
            display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
            background: rgba(0,0,0,0.06); padding: 4px; border-radius: 8px; margin-bottom: 16px;
        }
        .mode-tab-btn {
            background: transparent; border: none; padding: 10px; font-size: 12px; font-weight: 800;
            border-radius: 6px; cursor: pointer; color: var(--text-graphite); text-transform: uppercase;
            text-align: center; transition: 0.2s;
        }
        .mode-tab-btn.active { background: var(--forest-green); color: #FFF; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }

        /* ТАБЛИЦА МАТРИЦЫ */
        .matrix-table-viewport {
            width: 100%; max-height: 72vh; overflow: auto;
            border: 1px solid var(--border-color); border-radius: 8px;
            background: var(--card-bg); position: relative;
        }
        .matrix-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 11.5px; min-width: 890px; text-align: center; }
        .matrix-table th, .matrix-table td { border-right: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); padding: 6px 4px; }
        .matrix-table thead th { position: sticky; top: 0; z-index: 20; background: #E8EFE8; color: var(--forest-green); font-weight: 900; }
        [data-theme="dark"] .matrix-table thead th { background: #1B2922; }

        .matrix-sticky-col { position: sticky; left: 0; z-index: 10; background: var(--card-bg); font-weight: 900; font-size: 13px; color: var(--forest-green); min-width: 80px; }
        .matrix-table thead th.matrix-sticky-col { z-index: 30; }

        .cell-btn-content {
            background: var(--bg-paper); border: 1px solid transparent; border-radius: 5px;
            padding: 5px 2px; font-size: 12px; font-weight: 900; cursor: pointer; width: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
            color: var(--text-graphite); user-select: none;
        }
        .cell-btn-content.has-trees { background: rgba(45, 90, 39, 0.14); border-color: var(--forest-green); color: var(--forest-green); }
        .cell-mini-breakdown { display: flex; gap: 3px; font-size: 9px; font-weight: 700; line-height: 1; }
        .dot-del { color: #16A34A; } .dot-polu { color: #E67E22; } .dot-drova { color: #78350F; }

        /* ВСПЛЫВАЮЩИЙ ПУЛЬТ КАТЕГОРИЙ */
        .flyout-picker-backdrop { position: fixed; inset: 0; z-index: 5000; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; padding: 15px; }
        .flyout-picker-box { background: var(--card-bg); border: 2px solid var(--forest-green); border-radius: 12px; padding: 16px; width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 10px; }
        .flyout-grid-buttons { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .btn-flyout-cat { padding: 12px 6px; border-radius: 8px; font-weight: 900; font-size: 11px; cursor: pointer; border: 1.5px solid transparent; text-transform: uppercase; display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .btn-fly-del { background: rgba(22, 163, 74, 0.15); border-color: #16A34A; color: #16A34A; }
        .btn-fly-polu { background: rgba(230, 126, 34, 0.15); border-color: #E67E22; color: #E67E22; }
        .btn-fly-drova { background: rgba(120, 53, 15, 0.15); border-color: #78350F; color: #78350F; }

        .summary-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .summary-table th, .summary-table td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--border-color); font-size: 12px; }
        .summary-table th { font-weight: 800; color: var(--forest-green); text-transform: uppercase; font-size: 11px; background: rgba(45, 90, 39, 0.04); }
        .summary-table tr.total-row td { font-weight: 900; color: var(--forest-green); background: rgba(45, 90, 39, 0.08); font-size: 13.5px; }

        .composition-formula-box {
            background: linear-gradient(135deg, rgba(45, 90, 39, 0.12) 0%, rgba(230, 126, 34, 0.12) 100%);
            border: 1.5px solid var(--forest-green); border-radius: 10px;
            padding: 12px 16px; margin-top: 16px; display: flex; justify-content: space-between; align-items: center;
        }
        .composition-formula-val { font-size: 20px; font-weight: 900; color: var(--forest-green); font-family: 'Merriweather', serif; }

        .btn-custom { padding: 12px; font-weight: 700; border-radius: 8px; cursor: pointer; font-size: 12px; text-transform: uppercase; border: none; text-align: center; }
        .action-buttons-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 18px; }
    </style>
</head>
<body>

    <header class="glass-header-deck">
        <div class="header-tier-top">
            <a href="index.html" class="logo-container">
                <img src="logo.jpeg" alt="Лесовик" class="header-logo" onerror="this.style.display='none'">
                <h1 class="header-main-title">Лесовик ПРО</h1>
            </a>
            <div class="header-tier-actions">
                <a href="index.html" class="btn-nav">← Главная</a>
                <button class="btn-nav" onclick="toggleTheme()">🌓 Тема</button>
            </div>
        </div>
        <div class="header-sub-banner">
            Полевой журнал таксатора • Республика Коми (Нормативы Северо-Востока)
        </div>
        <div class="header-tier-bottom">
            <button class="btn-nav active" onclick="switchInputMode('matrix')" id="nav-mode-matrix">📋 Сетка-Точковка</button>
            <button class="btn-nav" onclick="switchInputMode('cards')" id="nav-mode-cards">🗂️ Карточки пород</button>
            <button class="btn-nav" onclick="downloadExcel()">📊 В Excel</button>
            <button class="btn-nav" style="border-color:var(--danger); color:var(--danger);" onclick="clearCurrentTally()">🗑️ Очистить</button>
        </div>
    </header>

    <main class="container">
        
        <div class="card">
            <h2>Паспорт лесосеки (Республика Коми)</h2>
            <div class="settings-grid">
                <div>
                    <label>Лесничество (Коми)</label>
                    <select id="sel-forest" onchange="onForestChange()">
                        <option value="">-- Выберите лесничество --</option>
                    </select>
                </div>
                <div>
                    <label>Участковое лесничество</label>
                    <select id="sel-subforest" onchange="savePassport()">
                        <option value="">-- Сначала лесничество --</option>
                    </select>
                </div>
                <div>
                    <label>Квартал / Выдел / Делянка</label>
                    <input type="text" id="tally-address" placeholder="кв. 45, выд. 12, дел. 1" oninput="savePassport()">
                </div>
                <div>
                    <label>Эксплуатационная площадь (га)</label>
                    <input type="number" id="area-ha-expl" value="1.0" step="0.1" min="0.01" oninput="calculateResults()">
                </div>
            </div>
        </div>

        <div class="card">
            <h2>Точковка и перечет деревьев по ступеням толщины</h2>

            <div class="species-picker-deck">
                <div style="flex:1;">
                    <label>Добавить породу (Нормативы Коми):</label>
                    <select id="species-add-select">
                        <option value="С">🌲 С — Сосна (табл. 5.6 / 7.4 Загреев)</option>
                        <option value="Е">🌲 Е — Ель (условно разновозрастные среднетаежные)</option>
                        <option value="Б">🌳 Б — Береза (табл. 5.25 / 7.30)</option>
                        <option value="Ос">🌳 Ос — Осина (табл. 5.31 Чернявский)</option>
                        <option value="Лс">🌲 Лс — Лиственница (табл. 2.15 Выводцев)</option>
                    </select>
                </div>
                <button class="btn-add-species" onclick="addNewSpecies()">➕ Добавить породу</button>
            </div>

            <div class="mode-switch-box">
                <button class="mode-tab-btn active" id="tab-mode-matrix" onclick="switchInputMode('matrix')">📋 Сетка-Точковка</button>
                <button class="mode-tab-btn" id="tab-mode-cards" onclick="switchInputMode('cards')">🗂️ Поштучные карточки</button>
            </div>

            <div id="view-matrix-container">
                <div class="matrix-table-viewport">
                    <table class="matrix-table" id="matrix-table-el"></table>
                </div>
            </div>

            <div id="view-cards-container" style="display:none;">
                <div id="cards-container-el"></div>
            </div>
        </div>

        <div class="card">
            <h2>Сводная перечетная ведомость и запас</h2>
            <div id="summary-container"></div>

            <div class="action-buttons-container">
                <button class="btn-custom" style="background:var(--forest-green); color:white;" onclick="downloadExcel()">Скачать ведомость в Excel</button>
                <button class="btn-custom" style="background:var(--danger); color:white;" onclick="clearCurrentTally()">Очистить ведомость</button>
            </div>
        </div>
    </main>

    <div class="flyout-picker-backdrop" id="flyoutBackdrop" onclick="closeFlyout(event)">
        <div class="flyout-picker-box" onclick="event.stopPropagation()">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:15px; font-weight:900; color:var(--forest-green);" id="flyoutTitle">Порода</span>
                <span id="flyoutTotalCount" style="font-size:12px; font-weight:bold; color:gray;">0 шт</span>
            </div>
            <div style="font-size:11px; text-transform:uppercase; font-weight:700; color:gray;">Категория технической годности (+1):</div>
            <div class="flyout-grid-buttons">
                <button class="btn-flyout-cat btn-fly-del" onclick="flyoutAdd('delovie')">
                    <span>🟢 Деловые</span>
                    <small id="fly-cnt-delovie">0 шт</small>
                </button>
                <button class="btn-flyout-cat btn-fly-polu" onclick="flyoutAdd('poludel')">
                    <span>🟠 Полудел</span>
                    <small id="fly-cnt-poludel">0 шт</small>
                </button>
                <button class="btn-flyout-cat btn-fly-drova" onclick="flyoutAdd('drova')">
                    <span>🟤 Дрова</span>
                    <small id="fly-cnt-drova">0 шт</small>
                </button>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:6px;">
                <button class="btn-nav" style="border-color:var(--danger); color:var(--danger);" onclick="flyoutSub()">➖ Убавить (-1)</button>
                <button class="btn-nav" onclick="document.getElementById('flyoutBackdrop').style.display='none'">Готово ✓</button>
            </div>
        </div>
    </div>

            ["Чернамское", ["Зареченское", "Усть-Вымское", "Часовское"]]
        ];

        // ОФИЦИАЛЬНЫЕ ОБЪЕМНЫЕ ТАБЛИЦЫ СЕВЕРО-ВОСТОКА (М³/СТВОЛ) ПО РАЗРЯДАМ ВЫСОТ
        const VOLUMES_KOMI = {
            'С': { // Сосна (по Загрееву, Вологодская, Архангельская, Коми)
                1: { 8: 0.041, 12: 0.111, 16: 0.222, 20: 0.381, 24: 0.584, 28: 0.812, 32: 1.071, 36: 1.365, 40: 1.691, 44: 2.052, 48: 2.450 },
                2: { 8: 0.038, 12: 0.102, 16: 0.201, 20: 0.344, 24: 0.528, 28: 0.741, 32: 0.985, 36: 1.261, 40: 1.572, 44: 1.910, 48: 2.290 },
                3: { 8: 0.035, 12: 0.094, 16: 0.183, 20: 0.312, 24: 0.481, 28: 0.678, 32: 0.910, 36: 1.171, 40: 1.463, 44: 1.782, 48: 2.140 },
                4: { 8: 0.032, 12: 0.086, 16: 0.168, 20: 0.284, 24: 0.439, 28: 0.621, 32: 0.835, 36: 1.082, 40: 1.361, 44: 1.670, 48: 2.010 },
                5: { 8: 0.029, 12: 0.078, 16: 0.151, 20: 0.256, 24: 0.398, 28: 0.569, 32: 0.768, 36: 1.001, 40: 1.265, 44: 1.560, 48: 1.890 }
            },
            'Е': { // Ель среднетаежная условно разновозрастная
                1: { 8: 0.035, 12: 0.098, 16: 0.198, 20: 0.345, 24: 0.541, 28: 0.785, 32: 1.082, 36: 1.425, 40: 1.820, 44: 2.260, 48: 2.760 },
                2: { 8: 0.032, 12: 0.089, 16: 0.181, 20: 0.315, 24: 0.495, 28: 0.720, 32: 0.995, 36: 1.310, 40: 1.680, 44: 2.100, 48: 2.560 },
                3: { 8: 0.028, 12: 0.081, 16: 0.164, 20: 0.285, 24: 0.450, 28: 0.655, 32: 0.910, 36: 1.205, 40: 1.550, 44: 1.940, 48: 2.380 },
                4: { 8: 0.025, 12: 0.073, 16: 0.148, 20: 0.258, 24: 0.410, 28: 0.598, 32: 0.830, 36: 1.105, 40: 1.430, 44: 1.800, 48: 2.210 },
                5: { 8: 0.022, 12: 0.065, 16: 0.133, 20: 0.231, 24: 0.370, 28: 0.542, 32: 0.755, 36: 1.010, 40: 1.310, 44: 1.660, 48: 2.050 }
            },
            'Б': { // Береза средней подзоны тайги
                1: { 8: 0.032, 12: 0.089, 16: 0.180, 20: 0.312, 24: 0.485, 28: 0.702, 32: 0.965, 36: 1.270, 40: 1.620, 44: 2.010, 48: 2.450 },
                2: { 8: 0.029, 12: 0.081, 16: 0.164, 20: 0.285, 24: 0.445, 28: 0.645, 32: 0.890, 36: 1.175, 40: 1.505, 44: 1.870, 48: 2.280 },
                3: { 8: 0.026, 12: 0.073, 16: 0.149, 20: 0.260, 24: 0.407, 28: 0.592, 32: 0.818, 36: 1.085, 40: 1.395, 44: 1.740, 48: 2.130 },
                4: { 8: 0.023, 12: 0.066, 16: 0.135, 20: 0.236, 24: 0.371, 28: 0.542, 32: 0.752, 36: 1.000, 40: 1.290, 44: 1.620, 48: 1.990 },
                5: { 8: 0.020, 12: 0.059, 16: 0.122, 20: 0.214, 24: 0.338, 28: 0.495, 32: 0.690, 36: 0.920, 40: 1.190, 44: 1.500, 48: 1.850 }
            },
            'Ос': { // Осина
                1: { 8: 0.034, 12: 0.096, 16: 0.198, 20: 0.345, 24: 0.540, 28: 0.785, 32: 1.080, 36: 1.425, 40: 1.820, 44: 2.260, 48: 2.760 },
                2: { 8: 0.031, 12: 0.088, 16: 0.180, 20: 0.315, 24: 0.495, 28: 0.720, 32: 0.995, 36: 1.315, 40: 1.685, 44: 2.100, 48: 2.570 },
                3: { 8: 0.028, 12: 0.080, 16: 0.163, 20: 0.286, 24: 0.452, 28: 0.660, 32: 0.915, 36: 1.215, 40: 1.560, 44: 1.950, 48: 2.390 }
            },
            'Лс': { // Лиственница
                1: { 12: 0.098, 16: 0.201, 20: 0.348, 24: 0.545, 28: 0.792, 32: 1.090, 36: 1.435, 40: 1.830, 44: 2.280, 48: 2.780 },
                2: { 12: 0.090, 16: 0.184, 20: 0.320, 24: 0.501, 28: 0.730, 32: 1.010, 36: 1.330, 40: 1.700, 44: 2.120, 48: 2.600 },
                3: { 12: 0.082, 16: 0.169, 20: 0.294, 24: 0.462, 28: 0.675, 32: 0.935, 36: 1.235, 40: 1.580, 44: 1.980, 48: 2.430 }
            }
        };

        const diameters = [8, 12, 16, 20, 24, 28, 32, 36, 40, 44, 48];
        const speciesNames = { 'С': 'Сосна', 'Е': 'Ель', 'Б': 'Береза', 'Ос': 'Осина', 'Лс': 'Лиственница' };

        let journalData = JSON.parse(localStorage.getItem('lesovik_komi_journal')) || {
            forest: '',
            subforest: '',
            address: '',
            areaHaExpl: 1.0,
            activeSpecies: ['С', 'Е', 'Б'],
            heightClasses: { 'С': 3, 'Е': 3, 'Б': 3, 'Ос': 2, 'Лс': 2 },
            trees: {} // { 'С': { 24: { delovie: 10, poludel: 2, drova: 1 } } }
        };

        let currentInputMode = 'matrix';
        let activeFlyoutTarget = { sp: null, d: null };

        function initApp() {
            // Инициализация выпадающего списка лесничеств
            const selForest = document.getElementById('sel-forest');
            KOMI_FORESTRY_DATA.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item[0];
                opt.innerText = item[0] + ' лесничество';
                if (journalData.forest === item[0]) opt.selected = true;
                selForest.appendChild(opt);
            });

            onForestChange(true);

            document.getElementById('tally-address').value = journalData.address || '';
            document.getElementById('area-ha-expl').value = journalData.areaHaExpl || 1.0;

            renderActiveView();
            calculateResults();
        }

        function onForestChange(keepSubforest = false) {
            const forestName = document.getElementById('sel-forest').value;
            journalData.forest = forestName;

            const selSub = document.getElementById('sel-subforest');
            selSub.innerHTML = '<option value="">-- Выберите участковое --</option>';

            const found = KOMI_FORESTRY_DATA.find(x => x[0] === forestName);
            if (found) {
                found[1].forEach(sub => {
                    const opt = document.createElement('option');
                    opt.value = sub;
                    opt.innerText = sub + ' уч. лесничество';
                    if (keepSubforest && journalData.subforest === sub) opt.selected = true;
                    selSub.appendChild(opt);
                });
            }
            savePassport();
        }

        function savePassport() {
            journalData.forest = document.getElementById('sel-forest').value;
            journalData.subforest = document.getElementById('sel-subforest').value;
            journalData.address = document.getElementById('tally-address').value;
            journalData.areaHaExpl = parseFloat(document.getElementById('area-ha-expl').value) || 1.0;
            saveData();
        }

        function saveData() {
            localStorage.setItem('lesovik_komi_journal', JSON.stringify(journalData));
        }

        function toggleTheme() {
            const b = document.documentElement;
            b.setAttribute('data-theme', b.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        }

        function switchInputMode(mode) {
            currentInputMode = mode;
            document.getElementById('tab-mode-matrix').classList.toggle('active', mode === 'matrix');
            document.getElementById('tab-mode-cards').classList.toggle('active', mode === 'cards');
            document.getElementById('nav-mode-matrix').classList.toggle('active', mode === 'matrix');
            document.getElementById('nav-mode-cards').classList.toggle('active', mode === 'cards');
            document.getElementById('view-matrix-container').style.display = (mode === 'matrix') ? 'block' : 'none';
            document.getElementById('view-cards-container').style.display = (mode === 'cards') ? 'block' : 'none';
            renderActiveView();
        }

        function renderActiveView() {
            if (currentInputMode === 'matrix') renderMatrix();
            else renderCards();
        }

        function addNewSpecies() {
            const sp = document.getElementById('species-add-select').value;
            if (journalData.activeSpecies.includes(sp)) return alert("Порода уже есть в списке!");
            journalData.activeSpecies.push(sp);
            if (!journalData.heightClasses[sp]) journalData.heightClasses[sp] = 3;
            saveData();
            renderActiveView();
            calculateResults();
        }

        function removeSpecies(sp) {
            if (journalData.activeSpecies.length <= 1) return alert("Оставьте хотя бы одну породу!");
            if (confirm(`Удалить породу ${sp} из ведомости?`)) {
                journalData.activeSpecies = journalData.activeSpecies.filter(x => x !== sp);
                saveData();
                renderActiveView();
                calculateResults();
            }
        }

        function initTreeData(sp, d) {
            if (!journalData.trees[sp]) journalData.trees[sp] = {};
            if (!journalData.trees[sp][d]) journalData.trees[sp][d] = { delovie: 0, poludel: 0, drova: 0 };
        }

        function renderMatrix() {
            const table = document.getElementById('matrix-table-el');
            let thead = `<tr>
                <th class="matrix-sticky-col">Порода</th>
                <th style="min-width:55px;">Разряд</th>` + 
                diameters.map(d => `<th style="min-width:48px;">${d}</th>`).join('') + 
                `<th>Итого</th><th>✕</th></tr>`;

            let tbody = '';
            journalData.activeSpecies.forEach(sp => {
                const rz = journalData.heightClasses[sp] || 3;
                let rowSum = 0;
                let cells = diameters.map(d => {
                    initTreeData(sp, d);
                    const item = journalData.trees[sp][d];
                    const tot = item.delovie + item.poludel + item.drova;
                    rowSum += tot;
                    const hasVal = tot > 0 ? 'has-trees' : '';
                    let breakdown = tot > 0 ? `<div class="cell-mini-breakdown"><span class="dot-del">${item.delovie}</span><span class="dot-polu">${item.poludel}</span><span class="dot-drova">${item.drova}</span></div>` : '';
                    return `<td><button class="cell-btn-content ${hasVal}" onclick="openFlyout('${sp}', ${d})"><span>${tot}</span>${breakdown}</button></td>`;
                }).join('');

                tbody += `<tr>
                    <td class="matrix-sticky-col">${sp} (${speciesNames[sp]||sp})</td>
                    <td>
                        <select onchange="updateRazryad('${sp}', this.value)" style="padding:2px; font-weight:700;">
                            ${[1,2,3,4,5].map(v => `<option value="${v}" ${rz==v?'selected':''}>${v}</option>`).join('')}
                        </select>
                    </td>
                    ${cells}
                    <td style="font-weight:900; color:var(--forest-green);">${rowSum}</td>
                    <td><button onclick="removeSpecies('${sp}')" style="color:var(--danger); border:none; background:none; cursor:pointer; font-weight:bold;">✕</button></td>
                </tr>`;
            });

            table.innerHTML = `<thead>${thead}</thead><tbody>${tbody}</tbody>`;
        }

        function renderCards() {
            const container = document.getElementById('cards-container-el');
            container.innerHTML = '';
            journalData.activeSpecies.forEach(sp => {
                const rz = journalData.heightClasses[sp] || 3;
                let grid = '';
                diameters.forEach(d => {
                    initTreeData(sp, d);
                    const item = journalData.trees[sp][d];
                    const tot = item.delovie + item.poludel + item.drova;
                    grid += `
                        <div style="background:var(--card-bg); border:1px solid var(--border-color); border-radius:8px; padding:8px; text-align:center;">
                            <div style="font-weight:800; font-size:13px; margin-bottom:4px;">Ø ${d} см (${tot} шт)</div>
                            <div style="display:flex; justify-content:space-around; font-size:11px;">
                                <span>🟢 ${item.delovie}</span><span>🟠 ${item.poludel}</span><span>🟤 ${item.drova}</span>
                            </div>
                            <button class="btn-nav" style="width:100%; margin-top:6px; height:26px;" onclick="openFlyout('${sp}', ${d})">+ Замер</button>
                        </div>
                    `;
                });

                container.innerHTML += `
                    <div style="background:var(--bg-paper); border:1px solid var(--border-color); border-radius:10px; padding:12px; margin-bottom:14px;">
                        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                            <span style="font-weight:800; color:var(--forest-green);">${sp} — ${speciesNames[sp]||sp} [Разряд высот: ${rz}]</span>
                            <button onclick="removeSpecies('${sp}')" style="color:var(--danger); background:none; border:none; cursor:pointer;">✕ Удалить</button>
                        </div>
                        <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); gap:8px;">${grid}</div>
                    </div>
                `;
            });
        }

        function updateRazryad(sp, val) {
            journalData.heightClasses[sp] = parseInt(val);
            saveData();
            calculateResults();
        }

        function openFlyout(sp, d) {
            activeFlyoutTarget = { sp, d };
            initTreeData(sp, d);
            const item = journalData.trees[sp][d];
            document.getElementById('flyoutTitle').innerText = `${sp} (${speciesNames[sp]||sp}) • Ø ${d} см`;
            updateFlyoutStats(item);
            document.getElementById('flyoutBackdrop').style.display = 'flex';
        }

        function updateFlyoutStats(item) {
            const tot = item.delovie + item.poludel + item.drova;
            document.getElementById('flyoutTotalCount').innerText = `${tot} шт`;
            document.getElementById('fly-cnt-delovie').innerText = `${item.delovie} шт`;
            document.getElementById('fly-cnt-poludel').innerText = `${item.poludel} шт`;
            document.getElementById('fly-cnt-drova').innerText = `${item.drova} шт`;
        }

        function flyoutAdd(cat) {
            const { sp, d } = activeFlyoutTarget;
            if (!sp || !d) return;
            initTreeData(sp, d);
            journalData.trees[sp][d][cat]++;
            updateFlyoutStats(journalData.trees[sp][d]);
            saveData();
            renderActiveView();
            calculateResults();
        }

        function flyoutSub() {
            const { sp, d } = activeFlyoutTarget;
            if (!sp || !d) return;
            const item = journalData.trees[sp][d];
            if (item.drova > 0) item.drova--;
            else if (item.poludel > 0) item.poludel--;
            else if (item.delovie > 0) item.delovie--;
            updateFlyoutStats(item);
            saveData();
            renderActiveView();
            calculateResults();
        }

        function closeFlyout(e) {
            if (e.target.id === 'flyoutBackdrop') document.getElementById('flyoutBackdrop').style.display = 'none';
        }

        // РАСЧЕТ КУБАТУРЫ ПО ОФИЦИАЛЬНЫМ ТАБЛИЦАМ СЕВЕРО-ВОСТОКА
        function calculateResults() {
            const explArea = parseFloat(document.getElementById('area-ha-expl').value) || 1.0;
            let totalVolumeAll = 0;
            let speciesVolumes = {};
            let tablesHTML = '';

            journalData.activeSpecies.forEach(sp => {
                const rz = journalData.heightClasses[sp] || 3;
                const vTable = (VOLUMES_KOMI[sp] && VOLUMES_KOMI[sp][rz]) ? VOLUMES_KOMI[sp][rz] : (VOLUMES_KOMI['С'][3]);

                let spStems = 0, spVol = 0;
                let rows = '';

                diameters.forEach(d => {
                    initTreeData(sp, d);
                    const item = journalData.trees[sp][d];
                    const tot = item.delovie + item.poludel + item.drova;
                    if (tot === 0) return;

                    const unitV = vTable[d] || 0;
                    const stepV = tot * unitV;
                    spStems += tot;
                    spVol += stepV;

                    rows += `<tr>
                        <td><b>${d}</b></td>
                        <td>${item.delovie}</td>
                        <td>${item.poludel}</td>
                        <td>${item.drova}</td>
                        <td><b>${tot}</b></td>
                        <td>${unitV.toFixed(3)}</td>
                        <td><b>${stepV.toFixed(2)}</b></td>
                    </tr>`;
                });

                if (spStems > 0) {
                    speciesVolumes[sp] = spVol;
                    totalVolumeAll += spVol;

                    tablesHTML += `
                        <div style="margin-top:12px; overflow-x:auto;">
                            <div style="font-weight:800; color:var(--forest-green); font-size:13px; margin-bottom:4px;">
                                🌲 ${sp} (${speciesNames[sp]||sp}) — Разряд высот: ${rz}
                            </div>
                            <table class="summary-table">
                                <thead>
                                    <tr><th>Ступень</th><th>Деловые</th><th>Полудел</th><th>Дрова</th><th>Всего шт</th><th>Объем 1 ств (м³)</th><th>Запас (м³)</th></tr>
                                </thead>
                                <tbody>
                                    ${rows}
                                    <tr class="total-row">
                                        <td colspan="4" style="text-align:right;">ИТОГО ПО ПОРОДЕ:</td>
                                        <td>${spStems}</td>
                                        <td>—</td>
                                        <td>${spVol.toFixed(2)} м³</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    `;
                }
            });

            // Формирование формулы состава (доли из 10)
            let formula = '—';
            if (totalVolumeAll > 0) {
                let parts = [];
                for (let sp in speciesVolumes) {
                    const share = Math.round((speciesVolumes[sp] / totalVolumeAll) * 10);
                    if (share > 0) parts.push(`${share}${sp}`);
                }
                formula = parts.join('') || '10' + Object.keys(speciesVolumes)[0];
            }

            const perHa = totalVolumeAll / explArea;

            const resHTML = totalVolumeAll > 0 ? `
                <div class="composition-formula-box">
                    <div>
                        <span style="font-size:11px; text-transform:uppercase; font-weight:700; color:var(--text-graphite); opacity:0.8;">Формула состава (по кубатуре Северо-Востока):</span>
                        <div class="composition-formula-val">${formula}</div>
                    </div>
                    <div style="text-align:right;">
                        <span style="font-size:11px; text-transform:uppercase; font-weight:700; color:var(--text-graphite); opacity:0.8;">Запас на 1 га:</span>
                        <div style="font-size:18px; font-weight:900; color:var(--info);">${perHa.toFixed(1)} м³/га</div>
                    </div>
                </div>
                ${tablesHTML}
                <div style="margin-top:12px; padding:12px; background:rgba(45,90,39,0.06); border-radius:8px; font-weight:800; font-size:14px; color:var(--forest-green);">
                    Общий ликвидный запас на лесосеке (${explArea} га): ${totalVolumeAll.toFixed(2)} м³
                </div>
            ` : '<p style="color:gray; font-size:13px;">Перечетная ведомость пуста. Внесите замеры через сетку или карточки.</p>';

            document.getElementById('summary-container').innerHTML = resHTML;
        }

        function clearCurrentTally() {
            if (confirm("Полностью очистить все замеры текущей ведомости?")) {
                journalData.trees = {};
                saveData();
                renderActiveView();
                calculateResults();
            }
        }

        function downloadExcel() {
            let rows = [
                ["ЭЛЕКТРОННАЯ ПЕРЕЧЕТНАЯ ВЕДОМОСТЬ (ЛЕСОВИК ПРО)"],
                ["Субъект РФ:", "Республика Коми (Северо-Восток)"],
                ["Лесничество:", journalData.forest || "Не указано"],
                ["Участковое лесничество:", journalData.subforest || "Не указано"],
                ["Квартал / Выдел / Делянка:", journalData.address || "Не указано"],
                ["Эксплуатационная площадь:", (document.getElementById('area-ha-expl').value || 1) + " га"],
                []
            ];

            journalData.activeSpecies.forEach(sp => {
                const rz = journalData.heightClasses[sp] || 3;
                const vTable = (VOLUMES_KOMI[sp] && VOLUMES_KOMI[sp][rz]) ? VOLUMES_KOMI[sp][rz] : (VOLUMES_KOMI['С'][3]);

                rows.push([`Порода: ${sp} (${speciesNames[sp]||sp})`, `Разряд высот: ${rz}`]);
                rows.push(["Ступень (см)", "Деловые (шт)", "Полуделовые (шт)", "Дрова (шт)", "Всего (шт)", "Объем 1 ств (м³)", "Суммарный объем (м³)"]);

                diameters.forEach(d => {
                    initTreeData(sp, d);
                    const item = journalData.trees[sp][d];
                    const tot = item.delovie + item.poludel + item.drova;
                    if (tot > 0) {
                        const unitV = vTable[d] || 0;
                        rows.push([d, item.delovie, item.poludel, item.drova, tot, unitV, +(tot * unitV).toFixed(2)]);
                    }
                });
                rows.push([]);
            });

            const ws = XLSX.utils.aoa_to_sheet(rows);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Перечетка Коми");
            XLSX.writeFile(wb, `perechetka_komi_${Date.now()}.xlsx`);
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
